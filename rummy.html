<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0E0620"/>
<title>Hutto Rummy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --font-body:'Inter',system-ui,sans-serif;
  --font-heading:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Fira Mono',monospace;
  --font-logo:'Space Grotesk',system-ui,sans-serif;
  --r-xs:8px; --r-sm:12px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --ease-spring:cubic-bezier(.32,.72,0,1);
  --ease-out:cubic-bezier(.4,0,.2,1);
  --shd:0 1px 12px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.04);
  --shd-lg:0 4px 32px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.05);
  /* set by applyTheme */
  --c-green:#22C55E; --c-red:#EF4444; --c-blue:#3B82F6; --c-orange:#F59E0B;
  --c-gold:#A855F7; --c-gold-rgb:168,85,247; --c-comp:#22D3EE; --c-comp-rgb:34,211,238;
  --c-bg:#0E0620; --c-bg-rgb:14,6,32; --c-bg2:#160A2C; --c-bg3:#1A0E36; --c-bg4:#281652;
  --c-txt:#F4EDFF; --c-txt2:#B9A3E0; --c-muted:#B9A3E0; --c-muted2:rgba(255,255,255,.52);
  --c-surf:rgba(168,85,247,.10); --c-surf2:rgba(168,85,247,.16); --c-surf3:rgba(168,85,247,.24);
  --c-bdr:rgba(168,85,247,.24); --c-bdr2:rgba(168,85,247,.38);
  --hdr-band:linear-gradient(135deg, rgba(168,85,247,.32) 0%, rgba(168,85,247,.10) 45%, rgba(34,211,238,.14) 100%);
  --c-gold-rgb-dark:121,61,178;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--c-gold);outline-offset:3px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;} }
html{height:100%;font-size:16px;-webkit-text-size-adjust:100%;}
body{background-color:var(--c-bg);color:var(--c-txt);font-family:var(--font-body);min-height:100%;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;}
#bg-photo{position:fixed;inset:0;z-index:-2;opacity:0;transition:opacity .6s ease;pointer-events:none;}
#bg-overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(0,0,0,.72);}
.aurora-drift{animation:auroraDrift 26s ease-in-out infinite alternate;}
@keyframes auroraDrift{0%{background-position:0% 0%,100% 0%,80% 100%,0% 100%,50% 50%}100%{background-position:20% 12%,82% 18%,64% 84%,14% 88%,50% 50%}}
img{max-width:100%;}
svg{vertical-align:middle;}

/* ── HEADER ── */
#app-header{position:fixed;top:0;left:0;right:0;z-index:400;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--hdr-band, none), rgba(3,3,6,.92);
  backdrop-filter:blur(40px) saturate(2);-webkit-backdrop-filter:blur(40px) saturate(2);
  border-bottom:1px solid rgba(var(--c-gold-rgb),.30);
  box-shadow:0 1px 0 rgba(var(--c-gold-rgb),.15), 0 8px 48px rgba(0,0,0,.6);}
.ah-logo-row{display:flex;align-items:center;gap:10px;}
.ah-badge{width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(145deg,var(--c-gold) 0%,var(--c-comp) 100%);
  display:inline-flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 3px 16px rgba(var(--c-gold-rgb),.45), inset 0 1px 0 rgba(255,255,255,.25);}
.ah-city{font-family:var(--font-logo);font-size:10px;font-weight:700;letter-spacing:3.5px;
  color:rgba(var(--c-gold-rgb),.9);text-transform:uppercase;line-height:1;}
.ah-wordmark{font-family:var(--font-logo);font-size:18px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(115deg,var(--c-gold) 0%,#fff 50%,var(--c-comp) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;}
.ah-right{display:flex;align-items:center;gap:8px;}
.ah-page{font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:2px;
  color:rgba(255,255,255,.5);text-transform:uppercase;}
.ah-icon-btn{width:40px;height:40px;border-radius:11px;background:rgba(var(--c-gold-rgb),.12);
  border:1.5px solid rgba(var(--c-gold-rgb),.3);color:var(--c-gold);display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:all .15s var(--ease-out);}
.ah-icon-btn:active{transform:scale(.9);}

.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 74px) 16px 120px;}

/* ── SCREENS ── */
.screen{display:none;}
.screen.active{display:block;animation:screenIn .34s var(--ease-spring);}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-title{font-family:var(--font-heading);font-size:30px;font-weight:800;letter-spacing:-.5px;
  color:var(--c-txt);margin-bottom:4px;line-height:1.15;}
.page-sub{font-family:var(--font-mono);font-size:11px;color:var(--c-muted);margin-bottom:20px;letter-spacing:.3px;}
.section-lbl{font-family:var(--font-body);font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.2px;color:var(--c-muted);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}
.back-btn{background:none;border:none;color:var(--c-muted);font-family:var(--font-body);font-size:14px;
  font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 0;margin-bottom:6px;}

/* ── BUTTONS ── */
.btn{width:100%;padding:16px;border:none;border-radius:16px;font-family:var(--font-body);font-size:16px;
  font-weight:700;cursor:pointer;user-select:none;letter-spacing:.3px;
  transition:all .2s var(--ease-out);display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:var(--shd);position:relative;overflow:hidden;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-gold{background:linear-gradient(135deg, rgb(var(--c-gold-rgb)) 0%, rgb(var(--c-gold-rgb)) 55%, rgb(var(--c-gold-rgb-dark)) 100%);
  color:#fff;border:1.5px solid rgba(var(--c-gold-rgb),.9);font-weight:800;
  box-shadow:0 0 0 1px rgba(var(--c-gold-rgb),.35), 0 6px 24px rgba(var(--c-gold-rgb),.4), 0 1px 0 rgba(255,255,255,.3) inset;}
.btn-green{background:linear-gradient(135deg,#2ED66E,#16A34A);color:#fff;border:1.5px solid rgba(34,197,94,.55);
  box-shadow:0 0 0 1px rgba(34,197,94,.25), 0 6px 22px rgba(34,197,94,.32), 0 1px 0 rgba(255,255,255,.22) inset;}
.btn-red{background:linear-gradient(135deg,#F86464,#DC2626);color:#fff;border:1.5px solid rgba(239,68,68,.55);}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--c-txt);border:1.5px solid rgba(255,255,255,.14);box-shadow:none;}
.btn-sm{padding:11px 16px;font-size:13px;border-radius:12px;width:auto;}
.mt{margin-top:10px;}
.tap-ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(255,255,255,.5) 0%,rgba(255,255,255,.18) 45%,transparent 70%);
  transform:translate(-50%,-50%) scale(0);animation:tapRipple .55s cubic-bezier(.3,.7,.4,1) forwards;}
.btn-gold .tap-ripple{background:radial-gradient(circle,rgba(0,0,0,.26) 0%,rgba(0,0,0,.1) 45%,transparent 70%);}
@keyframes tapRipple{to{transform:translate(-50%,-50%) scale(1);opacity:0;}}
@media (prefers-reduced-motion: reduce){.tap-ripple{display:none;}}

/* ── SETUP: player grid ── */
.count-pill{font-family:var(--font-mono);font-size:11px;color:var(--c-gold);font-weight:700;
  background:rgba(var(--c-gold-rgb),.14);border-radius:20px;padding:3px 11px;}
.player-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px;}
.p-btn{background:transparent;border:none;padding:10px 4px 8px;display:flex;flex-direction:column;
  align-items:center;gap:6px;text-align:center;position:relative;cursor:pointer;font-family:var(--font-body);
  font-size:11px;font-weight:600;color:var(--c-txt2);border-radius:14px;transition:transform .14s var(--ease-out);}
.p-btn:active{transform:scale(.9);}
.p-btn.on{color:var(--c-txt);}
.p-btn-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;font-family:var(--font-heading);flex-shrink:0;transition:box-shadow .18s ease;position:relative;}
.p-btn.on .p-btn-av{box-shadow:0 0 0 3px var(--c-gold), 0 0 0 6px rgba(var(--c-gold-rgb),.22), 0 6px 20px rgba(var(--c-gold-rgb),.3);}
.p-btn-check{position:absolute;top:-1px;right:-1px;width:18px;height:18px;border-radius:50%;background:var(--c-gold);
  display:none;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.35);}
.p-btn.on .p-btn-check{display:flex;}
.p-btn-name{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;}
.guest-inp{width:100%;padding:12px 14px;background:var(--c-bg3);border:1.5px solid var(--c-bdr2);border-radius:12px;
  color:var(--c-txt);font-family:var(--font-body);font-size:15px;outline:none;box-sizing:border-box;}
.stake-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.stake-chip{padding:9px 16px;border-radius:20px;border:1.5px solid var(--c-bdr2);background:transparent;
  font-family:var(--font-mono);font-size:14px;font-weight:600;cursor:pointer;color:var(--c-muted);transition:all .12s;}
.stake-chip.on{border-color:var(--c-gold);background:rgba(var(--c-gold-rgb),.15);color:var(--c-gold);font-weight:800;}

/* ── LIVE: pot bar ── */
.pot-bar{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;margin-bottom:12px;
  background:linear-gradient(135deg, rgba(var(--c-bg-rgb),.97) 0%, rgba(var(--c-gold-rgb),.10) 100%);
  border:1px solid rgba(var(--c-gold-rgb),.24);border-radius:14px;
  box-shadow:0 0 0 1px rgba(var(--c-gold-rgb),.06), 0 4px 20px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);}
.pot-lbl{font-family:var(--font-body);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;
  color:rgba(var(--c-gold-rgb),.6);margin-bottom:2px;}
.pot-val{font-family:var(--font-mono);font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--c-gold);
  line-height:1;text-shadow:0 0 20px rgba(var(--c-gold-rgb),.4);}
.pot-meta{font-family:var(--font-body);font-size:11px;color:var(--c-muted);margin-top:3px;}
.pot-right{text-align:right;}
.pot-timer{font-family:var(--font-mono);font-size:15px;font-weight:800;color:var(--c-gold);letter-spacing:.5px;}
.pot-round{font-family:var(--font-mono);font-size:9px;color:var(--c-muted2);margin-top:2px;}

/* ── SCOREBOARD TABLE ── */
.drops-help{font-family:var(--font-mono);font-size:10px;color:var(--c-muted);line-height:1.5;
  padding:9px 12px;margin-bottom:8px;background:rgba(var(--c-gold-rgb),.06);border:1px solid var(--c-bdr);border-radius:10px;}
.drops-help b{color:var(--c-gold);}
.sb-head{display:grid;grid-template-columns:1fr 54px 54px 40px;gap:6px;padding:0 12px 6px;
  font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  color:var(--c-muted);align-items:end;}
.sb-head span:not(:first-child){text-align:center;line-height:1.15;}
.sb-row{display:grid;grid-template-columns:1fr 54px 54px 40px;gap:6px;align-items:center;
  padding:10px 12px;border-radius:14px;margin-bottom:6px;position:relative;overflow:hidden;
  background:var(--c-surf);border:1px solid var(--c-bdr);border-left:3px solid transparent;transition:background .2s,border-color .2s;}
/* Eliminated — locked & red, unmistakably "can't play" */
.sb-row.out{background:linear-gradient(90deg,rgba(239,68,68,.12) 0%,rgba(255,255,255,.02) 55%);
  border-color:rgba(239,68,68,.25);border-left-color:var(--c-red);}
.sb-row.out .sb-name{color:rgba(255,255,255,.5);}
.sb-row.out .sb-av{filter:grayscale(.6);opacity:.65;}
/* Must-play — amber, "can play but can't drop" */
.sb-row.mustplay{border-color:rgba(245,158,11,.55);border-left-color:var(--c-orange);
  background:linear-gradient(90deg,rgba(245,158,11,.16) 0%,var(--c-surf) 60%);}
.sb-row.mustplay .sb-av{box-shadow:0 0 0 2px rgba(245,158,11,.5);}
/* Split-ready leader (≤2 drop choices) — green edge */
.sb-row.leaderlow{border-left-color:var(--c-green);}
.sb-lock{color:var(--c-red);opacity:.85;}
.sb-name-wrap{display:flex;align-items:center;gap:9px;min-width:0;}
.sb-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-heading);font-size:13px;font-weight:800;flex-shrink:0;border:1.5px solid;}
.sb-name{font-size:14px;font-weight:700;color:var(--c-txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-sub{font-family:var(--font-mono);font-size:8.5px;color:var(--c-muted);margin-top:1px;letter-spacing:.3px;}
.sb-pts{font-family:var(--font-mono);font-size:19px;font-weight:800;text-align:center;line-height:1;}
.sb-drops{text-align:center;}
.sb-drop-pips{display:flex;gap:2px;justify-content:center;}
.sb-pip{width:6px;height:6px;border-radius:50%;background:var(--c-gold);opacity:.9;}
.sb-drop-num{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--c-txt2);text-align:center;}
.sb-status{display:flex;align-items:center;justify-content:center;}
.badge-must{font-family:var(--font-mono);font-size:7.5px;font-weight:800;color:var(--c-orange);
  background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);border-radius:6px;
  padding:2px 4px;letter-spacing:.3px;line-height:1;text-align:center;}
.badge-out{font-family:var(--font-mono);font-size:8px;font-weight:800;color:var(--c-red);
  background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:6px;padding:2px 5px;letter-spacing:.5px;}
.streak-dots{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle;}
.streak-dot{width:5px;height:5px;border-radius:50%;background:var(--c-orange);}
@keyframes numPop{0%{transform:scale(1)}35%{transform:scale(1.4)}65%{transform:scale(.9)}100%{transform:scale(1)}}
.num-pop{animation:numPop .32s cubic-bezier(.34,1.56,.64,1);}

/* ── FLOATING ACTION BAR ── */
.action-bar{position:fixed;bottom:0;left:0;right:0;z-index:300;max-width:520px;margin:0 auto;
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;
  background:rgba(var(--c-bg-rgb),.94);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);
  border-top:1px solid rgba(var(--c-gold-rgb),.24);box-shadow:0 -8px 32px rgba(0,0,0,.5);}

/* ── MODAL / BOTTOM SHEET ── */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:8000;display:flex;align-items:flex-end;
  justify-content:center;padding:0 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--c-bg2);border:1px solid rgba(var(--c-gold-rgb),.3);border-radius:20px 20px 0 0;
  width:100%;max-width:520px;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 22px);
  animation:sheetIn .3s var(--ease-spring);max-height:90vh;overflow-y:auto;}
@keyframes sheetIn{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-title{font-family:var(--font-heading);font-size:20px;font-weight:800;color:var(--c-txt);margin-bottom:4px;}
.sheet-sub{font-family:var(--font-mono);font-size:11px;color:var(--c-muted);margin-bottom:18px;line-height:1.5;}
/* record-hand result picker */
.rh-player{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--c-bdr);}
.rh-player:last-of-type{border-bottom:none;}
.rh-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-heading);font-size:13px;font-weight:800;flex-shrink:0;border:1.5px solid;}
.rh-name{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--c-txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rh-opts{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:210px;}
.rh-opt{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:6px 8px;border-radius:9px;
  border:1.5px solid var(--c-bdr2);background:transparent;color:var(--c-muted);cursor:pointer;white-space:nowrap;transition:all .1s;}
.rh-opt.on{border-color:var(--c-gold);background:var(--c-gold);color:#fff;}
.rh-opt.win.on{border-color:var(--c-green);background:var(--c-green);}
.rh-opt.disabled{opacity:.28;cursor:not-allowed;}
.rh-custom{width:52px;padding:6px 4px;border-radius:9px;border:1.5px solid var(--c-bdr2);background:var(--c-bg3);
  color:var(--c-txt);font-family:var(--font-mono);font-size:12px;text-align:center;outline:none;}
.rh-must-note{font-family:var(--font-mono);font-size:8px;color:var(--c-orange);margin-top:2px;}

/* split result card */
.split-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:12px;
  margin-bottom:8px;background:var(--c-surf);border:1px solid var(--c-bdr);}
.split-payout{font-family:var(--font-mono);font-size:18px;font-weight:800;color:var(--c-green);}
.split-share{font-family:var(--font-mono);font-size:9px;color:var(--c-muted);}

/* ── NOTIF ── */
#notif{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:12px;right:12px;
  transform:translateY(-140%) scale(.96);opacity:0;border-radius:16px;padding:13px 15px;
  font-family:var(--font-body);font-size:13.5px;font-weight:600;z-index:9999;
  transition:transform .38s cubic-bezier(.34,1.56,.64,1),opacity .25s ease;text-align:left;
  display:flex;align-items:center;gap:11px;max-width:490px;margin:0 auto;line-height:1.35;
  box-shadow:0 8px 32px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25);pointer-events:none;}
#notif.show{transform:translateY(0) scale(1);opacity:1;}
#notif .notif-icon{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);color:#fff;}
#notif .notif-text{flex:1;min-width:0;}
#notif.ok{background:linear-gradient(135deg,#059669,#10B981);border:1px solid rgba(110,255,190,.65);color:#fff;}
#notif.err{background:linear-gradient(135deg,#DC2626,#F43F5E);border:1px solid rgba(255,150,160,.65);color:#fff;}
#notif.warn{background:linear-gradient(135deg,#D97706,#F59E0B);border:1px solid rgba(255,210,130,.7);color:#fff;}
#notif.info{background:linear-gradient(135deg,#2563EB,#38BDF8);border:1px solid rgba(150,205,255,.65);color:#fff;}

.empty-wrap{text-align:center;padding:50px 20px;}
.empty-emoji{font-size:50px;margin-bottom:14px;}
.pill-info{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;
  color:var(--c-muted);background:rgba(255,255,255,.04);border:1px solid var(--c-bdr);border-radius:20px;padding:5px 12px;}
.link-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;

.rmx-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--c-bdr);}
.rmx{border-collapse:collapse;width:100%;font-family:var(--font-mono);font-size:15px;min-width:100%;}
.rmx th,.rmx td{padding:11px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--c-bdr);}
.rmx thead th{position:sticky;top:0;background:var(--c-bg2);color:var(--c-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;z-index:1;}
.rmx th.rmx-h,.rmx td.rmx-h{position:sticky;left:0;background:var(--c-bg2);text-align:left;padding-left:12px;z-index:2;font-weight:700;color:var(--c-txt);}
.rmx thead th.rmx-h{z-index:3;}

  display:inline-flex;align-items:center;gap:4px;}
.rmx-edit:active{transform:scale(.92);}
/* ── Stats screen ── */
.stat-kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.stat-kpi{position:relative;overflow:hidden;text-align:center;padding:12px 8px;border-radius:14px;

function hexToRgb(hex){return parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16);}
function _relLum(r,g,b){var f=function(c){c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);};return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);}
function _contrastRatio(a,b){var l1=_relLum(a[0],a[1],a[2]),l2=_relLum(b[0],b[1],b[2]);return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);}

  var ar=theme.accentRgb||hexToRgb(theme.accent),cr=theme.compRgb||hexToRgb(theme.comp),br=hexToRgb(theme.bg);

    'radial-gradient(ellipse 55% 45% at 92% 18%,rgba('+cr+',.30) 0%,transparent 52%)',
    'radial-gradient(ellipse 60% 55% at 82% 92%,rgba('+ar+',.28) 0%,transparent 55%)',

  var bg=theme.bg;var bA=_hexArr(bg);
  r.setProperty('--c-bg',bg);r.setProperty('--c-bg-rgb',bA[0]+','+bA[1]+','+bA[2]);
  r.setProperty('--c-bg2',theme.s1.replace('0.88','0.96'));r.setProperty('--c-bg3',theme.s1);r.setProperty('--c-bg4',theme.s2);

  r.setProperty('--c-surf','rgba('+aRgb+',.10)');r.setProperty('--c-surf2','rgba('+aRgb+',.16)');r.setProperty('--c-surf3','rgba('+aRgb+',.24)');

/* ═══════════════ RUMMY ENGINE (identical to test_rummy.js) ═══════════════ */
var RUMMY_LIMIT=201, ALIVE_MAX=200, DROP_UNIT=20, MID_DROP=40, FULL_COUNT=80, MAX_PLAYERS=8, MUST_PLAY_OVER=180;
function rDropChoices(points){return Math.max(0,Math.floor((ALIVE_MAX-points)/DROP_UNIT));}
function rIsEliminated(points){return points>=RUMMY_LIMIT;}
function rIsMustPlay(points,streak){return points>MUST_PLAY_OVER||streak>=3;}
function rLateralEntryPoints(activePointsArr){if(!activePointsArr.length)return 1;var hi=Math.max.apply(null,activePointsArr);var pts=hi+1;return pts>=RUMMY_LIMIT?null:pts;}
function rDistribute(potCents,weights){var total=weights.reduce(function(a,b){return a+b;},0);if(total<=0)return weights.map(function(){return 0;});var raw=weights.map(function(w){return potCents*w/total;});var out=raw.map(function(x){return Math.floor(x);});var used=out.reduce(function(a,b){return a+b;},0);var rem=potCents-used;var order=raw.map(function(x,i){return {i:i,f:x-Math.floor(x)};}).sort(function(a,b){return b.f-a.f||a.i-b.i;});for(var k=0;k<rem;k++)out[order[k%order.length].i]++;return out;}
function rSplitEligible(activePointsArr){var n=activePointsArr.length;if(n===3)return activePointsArr.every(function(p){return rDropChoices(p)<=2;});if(n===2)return true;return false;}
function rSplitWeights(activePointsArr){return activePointsArr.map(function(p){return rDropChoices(p)+1;});}
function rSplitPayoutCents(potCents,activePointsArr){return rDistribute(potCents,rSplitWeights(activePointsArr));}
/* money */
function cents(v){return Math.round(v*100);}
function fromCents(c){return c/100;}
function fmt(v){var n=Math.abs(Math.round(v*100)/100);return Number.isInteger(n)?'$'+n:'$'+n.toFixed(2);}

function animateMoney(el,from,to,ms){

  var toC=Math.round(to*100),fromC=Math.round(from*100);
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches||toC===fromC){el.textContent=fmt(to);return;}
  var tok=(el.__t=(el.__t||0)+1),t0=performance.now(),ease=function(x){return 1-Math.pow(1-x,3);};
  (function fr(now){if(el.__t!==tok)return;var pr=Math.min((now-t0)/ms,1);el.textContent=fmt((fromC+(toC-fromC)*ease(pr))/100);if(pr<1)requestAnimationFrame(fr);else el.textContent=fmt(to);})(t0);
  setTimeout(function(){if(el.__t===tok)el.textContent=fmt(to);},ms+120);
}

function cssEsc(s){return String(s).replace(/["\\]/g,'\\$&');}

/* ═══════════════ REPLAY ENGINE — timeline is the single source of truth ═══════════════
   Rebuilds players/points/streaks/eliminations/pot/round entirely from the ordered
   event log. This is what makes editing a past hand correct: change the event, replay,
   and everything downstream (including later eliminations and lateral-entry points) is
   recomputed exactly. */
function rebuildFromTimeline(){
  if(!game.timeline){game.timeline=[];}
  if(!game.starterNames){game.starterNames=game.players.map(function(p){return p.name;});}
  var byName={},order=[];
  game.starterNames.forEach(function(n){ byName[n]={name:n,points:0,streak:0,mustPlay:false,out:false,laterals:0}; order.push(n); });
  var pot=game.buyCents*game.starterNames.length, hands=[], round=0, lateralCount=0;
  game.timeline.forEach(function(ev){
    if(ev.k==='lateral'){
      var actPts=order.map(function(n){return byName[n];}).filter(function(p){return !p.out;}).map(function(p){return p.points;});
      var lp=rLateralEntryPoints(actPts); if(lp===null)lp=ALIVE_MAX;
      if(byName[ev.name]){var p=byName[ev.name];p.out=false;p.points=lp;p.streak=0;p.laterals=(p.laterals||0)+1;}
      else{byName[ev.name]={name:ev.name,points:lp,streak:0,mustPlay:false,out:false,laterals:0};order.push(ev.name);}
      pot+=game.buyCents; lateralCount++;
    }else{ // hand
      round++;
      var rec={round:round,results:[]};
      ev.results.forEach(function(r){
        var p=byName[r.name];
        var add=(r.type==='drop')?DROP_UNIT:(r.type==='mid')?MID_DROP:(r.type==='full')?FULL_COUNT:(r.type==='win')?0:(+r.add||0);
        if(p&&!p.out){
          p.points+=add;
          if(r.type==='drop')p.streak++; else p.streak=0;
          if(rIsEliminated(p.points))p.out=true;
        }
        rec.results.push({name:r.name,type:r.type,add:add});
      });
      hands.push(rec);
    }
  });
  game.players=order.map(function(n){return byName[n];});

/* ═══════════════ EDIT / DELETE A RECORDED HAND ═══════════════ */
// Map a matrix hand number (1-based, hand events only) to its timeline index.
function _handEventIndex(handNo){
  var seen=0;
  for(var i=0;i<game.timeline.length;i++){ if(game.timeline[i].k==='hand'){ seen++; if(seen===handNo) return i; } }
  return -1;
}
var _editHandNo=null, _editChoices=null;
function openEditHand(handNo){
  if(game.ended){notify('This game is finished','info');return;}
  var idx=_handEventIndex(handNo); if(idx<0)return;
  var ev=game.timeline[idx];
  _editHandNo=handNo;
  _editChoices={};
  ev.results.forEach(function(r){ _editChoices[r.name]={type:r.type,custom:r.type==='played'?r.add:''}; });
  var rows=ev.results.map(function(r){

      '<div class="rh-av" style="background:rgba('+pal.rgb+',.22);color:'+pal.hex+';border-color:rgba('+pal.rgb+',.4)">'+escH(r.name.charAt(0).toUpperCase())+'</div>'+

        '<button class="rh-opt'+(t==='mid'?' on':'')+'" onclick="ehPick(\''+escQ(r.name)+'\',\'mid\',this)">Mid 40</button>'+
        '<button class="rh-opt'+(t==='full'?' on':'')+'" onclick="ehPick(\''+escQ(r.name)+'\',\'full\',this)">Full 80</button>'+
        '<input class="rh-custom" type="number" inputmode="numeric" min="0" max="120" placeholder="pts" value="'+(t==='played'?r.add:'')+'" oninput="ehCustom(\''+escQ(r.name)+'\',this.value,this)"/>'+
      '</div></div>';
  }).join('');
  openSheet(

    '</div>'+

function ehPick(name,type,btn){
  if(type==='win'){ Object.keys(_editChoices).forEach(function(n){ if(n!==name&&_editChoices[n].type==='win'){_editChoices[n].type=null;var row=document.querySelector('[data-eh="'+cssEsc(n)+'"]');if(row){row.querySelectorAll('.rh-opt').forEach(function(b){b.classList.remove('on');});var ci=row.querySelector('.rh-custom');if(ci)ci.value='';}} }); }
  _editChoices[name]={type:type,custom:''};
  var row=btn.closest('.rh-player');row.querySelectorAll('.rh-opt').forEach(function(b){b.classList.remove('on');});var ci=row.querySelector('.rh-custom');if(ci)ci.value='';
  btn.classList.add('on');haptic('light');
}
function ehCustom(name,val,inp){
  var row=inp.closest('.rh-player');row.querySelectorAll('.rh-opt').forEach(function(b){b.classList.remove('on');});
  var n=parseInt(val,10);
  if(val===''||isNaN(n)){_editChoices[name]={type:null,custom:''};return;}
  _editChoices[name]={type:'played',custom:Math.max(0,Math.min(120,n))};
}
function saveEditHand(){
  var names=Object.keys(_editChoices);
  var winners=names.filter(function(n){return _editChoices[n].type==='win';});
  if(winners.length!==1){notify('Pick exactly one winner','err');return;}
  var missing=names.filter(function(n){return !_editChoices[n].type;});
  if(missing.length){notify('Set a result for: '+missing.join(', '),'err');return;}
  var idx=_handEventIndex(_editHandNo); if(idx<0)return;
  game.timeline[idx].results=names.map(function(n){
    var ch=_editChoices[n];
    var add=(ch.type==='drop')?DROP_UNIT:(ch.type==='mid')?MID_DROP:(ch.type==='full')?FULL_COUNT:(ch.type==='win')?0:(+ch.custom||0);
    return {name:n,type:ch.type,add:add};
  });
  rebuildFromTimeline();saveGame();closeSheet();renderLive();
  haptic('success');notify('✅ Hand '+_editHandNo+' updated — scores recalculated','ok');
}
function deleteHand(handNo){
  if(!confirm('Delete Hand '+handNo+'? All later hands stay, and every score is recalculated.'))return;
  var idx=_handEventIndex(handNo); if(idx<0)return;
  game.timeline.splice(idx,1);
  rebuildFromTimeline();saveGame();closeSheet();renderLive();
  haptic('success');notify('🗑 Hand '+handNo+' deleted — scores recalculated','ok');
}

function commitHand(){
  var act=activePlayers();
  // validate: exactly one winner, everyone has a result
  var winners=act.filter(function(p){return rhChoices[p.name].type==='win';});
  if(winners.length!==1){notify('Pick exactly one winner','err');return;}
  var missing=act.filter(function(p){return !rhChoices[p.name].type;});
  if(missing.length){notify('Set a result for: '+missing.map(function(p){return p.name;}).join(', '),'err');return;}
  // validate played points
  for(var i=0;i<act.length;i++){var c=rhChoices[act[i].name];if(c.type==='played'&&(isNaN(c.custom)||c.custom<0||c.custom>120)){notify('Played points must be 0–120','err');return;}}

  var results=act.map(function(p){
    var ch=rhChoices[p.name];
    var add=(ch.type==='drop')?DROP_UNIT:(ch.type==='mid')?MID_DROP:(ch.type==='full')?FULL_COUNT:(ch.type==='win')?0:ch.custom;
    return {name:p.name,type:ch.type,add:add};
  });
  var outBefore=game.players.filter(function(p){return p.out;}).map(function(p){return p.name;});
  game.timeline.push({k:'hand',results:results});
  rebuildFromTimeline();                 // single source of truth: recompute all state
  var newlyOut=game.players.filter(function(p){return p.out&&outBefore.indexOf(p.name)<0;}).map(function(p){return p.name;});

  saveGame();closeSheet();
  // number pop on changed points
  renderLive();
  act.forEach(function(p){var el=document.querySelector('[data-pts="'+cssEsc(p.name)+'"]');if(el){el.classList.remove('num-pop');void el.offsetWidth;el.classList.add('num-pop');}});

  // immediate warnings
  if(newlyOut.length){haptic('heavy');notify('❌ '+newlyOut.join(', ')+' hit 201 — eliminated','err');}
  var mpMsgs=[];
  game.players.forEach(function(p){
    if(p.out)return;
    if(p.streak>=3)mpMsgs.push(p.name+' (3 drops)');
    else if(p.points>MUST_PLAY_OVER)mpMsgs.push(p.name+' (>180)');
  });
  if(mpMsgs.length){setTimeout(function(){notify('⚠ MUST PLAY next hand: '+mpMsgs.join(', '),'warn');},newlyOut.length?900:0);}

  // auto-end check
  var a2=activePlayers();
  if(a2.length===1){setTimeout(function(){finishWinner();},600);}
}

    ctx.textAlign='right'; ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='700 '+px(10)+'px '+MONO;
    ctx.fillText('PTS',ptsR,y+px(9)); ctx.fillText('WON',netR,y+px(9));
    y+=px(20); ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(PAD,y,W-PAD*2,px(1)); y+=px(8);

    var medals=['🥇','🥈','🥉'];
    sorted.forEach(function(p,i){
      if(i%2===1){ctx.fillStyle='rgba(255,255,255,.03)'; ctx.fillRect(PAD-px(4),y,W-PAD*2+px(8),ROW);}
      var mid=y+ROW*0.5;
      ctx.textAlign='left'; ctx.font=px(16)+'px '+FONT; ctx.fillStyle='#fff';
      if(i<3)ctx.fillText(medals[i],PAD-px(2),mid+px(6)); else {ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='700 '+px(13)+'px '+MONO;ctx.fillText(String(i+1),PAD+px(2),mid+px(5));}
      ctx.fillStyle=i===0?'#fff':'rgba(255,255,255,.9)'; ctx.font=(i===0?'800':'700')+' '+px(16)+'px '+FONT;
      ctx.fillText(p.name,nameL,mid+px(6));
      ctx.textAlign='right'; ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='500 '+px(14)+'px '+MONO; ctx.fillText(String(p.points),ptsR,mid+px(5));
      ctx.fillStyle='#22C55E'; ctx.font='800 '+px(16)+'px '+MONO; ctx.fillText(fmt(p.cents/100),netR,mid+px(6));
      ctx.textAlign='left'; y+=ROW;
    });
    if(elim.length){
      y+=px(10); ctx.fillStyle='rgba(239,68,68,.7)'; ctx.font='800 '+px(11)+'px '+MONO; ctx.textAlign='left'; ctx.fillText('ELIMINATED',PAD,y+px(9)); y+=px(18);
      elim.forEach(function(p){
        var mid=y+ELIMROW*0.5;
        ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='600 '+px(14)+'px '+FONT; ctx.textAlign='left'; ctx.fillText(p.name,PAD,mid+px(5));
        ctx.fillStyle='#F87171'; ctx.font='700 '+px(14)+'px '+MONO; ctx.textAlign='right'; ctx.fillText(p.points+' pts',netR,mid+px(5)); ctx.textAlign='left';
        y+=ELIMROW;
      });
    }
    y+=px(20); ctx.fillStyle='rgba(255,255,255,.15)'; ctx.fillRect(PAD,y,W-PAD*2,px(1)); y+=px(20);
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.font='400 '+px(11)+'px '+MONO; ctx.textAlign='center';
    ctx.fillText('Hutto Rummy 201  ·  huttopoker.github.io',W/2,y); ctx.textAlign='left';
    return y+px(16);
  }
  var H=draw(mctx);
  var canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H;
  draw(canvas.getContext('2d'));
  return canvas;
}
function _showRummyShot(canvas){

async function _shareImg(dataUrl,fname){
  try{
    var blob=await(await fetch(dataUrl)).blob();
    var file=new File([blob],fname,{type:'image/png'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({title:'Hutto Rummy — Results',files:[file]}); return; }
  }catch(e){ if(e.name==='AbortError')return; }
  // desktop fallback: download + open WhatsApp web
  var a=document.createElement('a');a.href=dataUrl;a.download=fname;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){window.open('https://web.whatsapp.com/','_blank');},500);
}
async function shareResults(){
  if(!game||!game.result){notify('No finished game to share','err');return;}
  notify('📸 Building summary…','info');
  var canvas=_buildRummyCanvas(game);
  var url=canvas.toDataURL('image/png');
  try{
    var blob=await(await fetch(url)).blob();
    var file=new File([blob],'rummy-results.png',{type:'image/png'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({title:'Hutto Rummy — Results',files:[file]}); return; }
  }catch(e){ if(e.name==='AbortError')return; }
  _showRummyShot(canvas);
}

/* ═══════════════ SHEETS ═══════════════ */

/* ═══════════════ ROUND-BY-ROUND MATRIX ═══════════════ */
function shortName(n){var t=String(n).split(' ')[0];return t.length>7?t.slice(0,6)+'…':t;}
function renderRoundMatrix(g,editable){
  if(!g.hands||!g.hands.length)return '<div class="pill-info" style="width:100%;justify-content:center;box-sizing:border-box">No hands recorded yet</div>';
  var players=g.players.map(function(p){return p.name;});
  var head='<th class="rmx-h">Hand</th>'+players.map(function(n){return '<th title="'+escH(n)+'">'+escH(shortName(n))+'</th>';}).join('');
  var body=g.hands.map(function(h){
    var by={};h.results.forEach(function(r){by[r.name]=r;});
    var cells=players.map(function(n){
      var r=by[n];
      if(!r)return '<td class="rmx-zero">·</td>';
      if(r.type==='win')return '<td class="rmx-win">W</td>';
      if(r.type==='drop')return '<td class="rmx-drop">20↓</td>';
      if(r.add===0)return '<td class="rmx-zero">0</td>';
      return '<td>+'+r.add+'</td>';
    }).join('');
    var handCell=editable
      ? '<td class="rmx-h"><button class="rmx-edit" onclick="openEditHand('+h.round+')">'+h.round+' <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></td>'
      : '<td class="rmx-h">'+h.round+'</td>';
    return '<tr>'+handCell+cells+'</tr>';
  }).join('');
  var foot='<td class="rmx-h">Total</td>'+g.players.map(function(p){return '<td class="'+(p.out?'out':'')+'">'+p.points+(p.out?' ✕':'')+'</td>';}).join('');
  return '<div class="rmx-scroll"><table class="rmx"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody>'+
    '<tfoot><tr>'+foot+'</tr></tfoot></table></div>'+
    '<div class="rmx-legend"><span style="color:var(--c-green)">W = won hand</span><span style="color:var(--c-orange)">20↓ = initial drop</span><span>+N = points that hand</span><span style="color:var(--c-red)">✕ = out</span></div>';
}
function openRounds(){
  if(!game||!game.hands.length){notify('No hands recorded yet','info');return;}
  var canEdit=!game.ended;
  openSheet('<div class="sheet-title">Round history</div><div class="sheet-sub">'+(canEdit?'Tap a <b>hand number</b> to fix a mis-entered result — scores recalculate automatically.':'Every hand, and the points each player took.')+'</div>'+renderRoundMatrix(game,canEdit)+'<button class="btn btn-ghost mt" onclick="closeSheet()">Close</button>');
}

/* ═══════════════ HISTORY (rummy-only, separate from poker) ═══════════════ */
var RUMMY_HIST_KEY='rummy-hist-v1';
function loadHistory(){try{var a=JSON.parse(localStorage.getItem(RUMMY_HIST_KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function saveHistoryArr(a){try{localStorage.setItem(RUMMY_HIST_KEY,JSON.stringify(a));}catch(e){}}
function saveToHistory(g){
  var cashed={};g.result.payouts.forEach(function(p){cashed[p.name]=p.cents;});
  var rec={
    id:g.startedAt,
    dateLabel:new Date(g.startedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
    potCents:g.potCents,buyCents:g.buyCents,mode:g.result.mode,
    durationSecs:Math.floor((g.endedAt-g.startedAt)/1000),
    players:g.players.map(function(p){return {name:p.name,points:p.points,out:p.out,payoutCents:cashed[p.name]||0,laterals:p.laterals||0};}),
    hands:g.hands
  };
  var hist=loadHistory();hist.unshift(rec);if(hist.length>200)hist=hist.slice(0,200);saveHistoryArr(hist);
}
// Aggregate per-player stats across all finished games.
function computeRummyStats(){
  var hist=loadHistory();var byP={};
  hist.forEach(function(g){
    // find top payout that game (for "win" credit)
    var top=0;g.players.forEach(function(p){if(p.payoutCents>top)top=p.payoutCents;});
    g.players.forEach(function(p){
      var s=byP[p.name]||(byP[p.name]={name:p.name,games:0,wins:0,cashed:0,elims:0,wonCents:0,stakedCents:0,pts:0});
      s.games++;
      s.stakedCents+=g.buyCents*(1+(p.laterals||0));
      s.wonCents+=p.payoutCents;
      s.pts+=p.points;
      if(p.payoutCents>0)s.cashed++;
      if(p.payoutCents===top&&top>0)s.wins++;
      if(p.out)s.elims++;
    });
  });
  var arr=Object.keys(byP).map(function(k){var s=byP[k];s.netCents=s.wonCents-s.stakedCents;s.avgPts=s.games?Math.round(s.pts/s.games):0;return s;});
  arr.sort(function(a,b){return b.netCents-a.netCents;});
  return {games:hist.length,history:hist,players:arr};
}

/* ═══════════════ STATS SCREEN ═══════════════ */
function openStats(){renderStats();show('stats');}
function statsBack(){
  if(game&&!game.ended){renderLive();show('live');}
  else if(game&&game.ended){show('results');}
  else show('setup');
}
function renderStats(){
  var st=computeRummyStats();
  var el=document.getElementById('screen-stats');
  if(!st.games){
    el.innerHTML='<button class="back-btn" onclick="statsBack()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Back</button>'+
      '<div class="page-title">Stats</div><div class="page-sub">Rummy analytics — kept separate from poker</div>'+
      '<div class="empty-wrap"><div class="empty-emoji">📊</div><div style="font-weight:800;font-size:18px;color:var(--c-txt);margin-bottom:6px">No games yet</div>'+
      '<div style="font-family:var(--font-mono);font-size:12px;color:var(--c-muted)">Finish a game to build your history &amp; leaderboard.</div></div>';
    return;
  }
  var totalPot=st.history.reduce(function(a,g){return a+g.potCents;},0);
  var topWin=st.players.slice().sort(function(a,b){return b.wins-a.wins;})[0];
  var maxAbs=Math.max.apply(null,st.players.map(function(p){return Math.abs(p.netCents);}))||1;
  var medals=['🥇','🥈','🥉'];
  var lb=st.players.map(function(p,i){
    var pos=p.netCents>=0;
    var pct=Math.round(Math.abs(p.netCents)/maxAbs*100);
    var pal=nameColor(p.name);
    var rank=i<3?'<span style="font-size:15px">'+medals[i]+'</span>':(i+1);
    return '<div class="lb-row"><div class="lb-rank">'+rank+'</div>'+
      '<div class="lb-av" style="background:rgba('+pal.rgb+',.22);color:'+pal.hex+';border-color:rgba('+pal.rgb+',.4)">'+escH(p.name.charAt(0).toUpperCase())+'</div>'+
      '<div style="min-width:0"><div style="font-weight:700;color:var(--c-txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escH(p.name)+'</div>'+
      '<div style="font-family:var(--font-mono);font-size:9.5px;color:var(--c-muted);margin-top:2px">'+p.games+'g · '+p.wins+'W · '+p.elims+' out · avg '+p.avgPts+' pts</div>'+
      '<div class="lb-bar-track"><div class="lb-bar-fill" style="width:'+pct+'%;background:'+(pos?'var(--c-green)':'var(--c-red)')+'"></div></div></div>'+
      '<div class="lb-net" style="color:'+(pos?'var(--c-green)':'var(--c-red)')+'">'+(pos?'+':'−')+fmt(Math.abs(p.netCents)/100)+'</div></div>';
  }).join('');
  var games=st.history.map(function(g,i){
    var winner=g.players.slice().sort(function(a,b){return b.payoutCents-a.payoutCents;})[0];
    return '<div class="hist-card" onclick="openGameDetail('+i+')">'+
      '<div style="min-width:0"><div class="hist-win">'+(g.mode==='winner'?'🏆 ':'🤝 ')+escH(winner?winner.name:'—')+'</div>'+
      '<div class="hist-date">'+escH(g.dateLabel)+' · '+g.players.length+'p · '+(g.mode==='winner'?'winner':g.result?'':'split')+'</div></div>'+
      '<div style="text-align:right"><div style="font-family:var(--font-mono);font-size:14px;font-weight:800;color:var(--c-gold)">'+fmt(g.potCents/100)+'</div>'+
      '<div class="hist-date">pot</div></div></div>';
  }).join('');
  el.innerHTML=
    '<button class="back-btn" onclick="statsBack()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Back</button>'+
    '<div class="page-title">Stats</div><div class="page-sub">Rummy analytics — separate from poker</div>'+
    '<div class="stat-kpi-grid">'+
      '<div class="stat-kpi"><div class="stat-kpi-val" style="color:var(--c-gold)">'+st.games+'</div><div class="stat-kpi-lbl">Games</div></div>'+
      '<div class="stat-kpi"><div class="stat-kpi-val">'+fmt(totalPot/100)+'</div><div class="stat-kpi-lbl">Total Pot</div></div>'+
      '<div class="stat-kpi"><div class="stat-kpi-val" style="font-size:15px">'+escH(topWin&&topWin.wins?shortName(topWin.name):'—')+'</div><div class="stat-kpi-lbl">Most Wins</div></div>'+
    '</div>'+
    '<div class="section-lbl">Leaderboard — net winnings</div>'+lb+
    '<div class="section-lbl" style="margin-top:18px">Game history</div>'+games;
}
function openGameDetail(i){
  var st=computeRummyStats();var g=st.history[i];if(!g)return;
  var sorted=g.players.slice().sort(function(a,b){return b.payoutCents-a.payoutCents;});
  var rows=sorted.map(function(p){
    return '<div class="split-row"><span style="font-weight:700;color:'+(p.out?'var(--c-txt2)':'var(--c-txt)')+'">'+escH(p.name)+' <span style="font-family:var(--font-mono);font-size:10px;color:var(--c-muted)">'+p.points+' pts</span></span>'+
      '<span class="split-payout" style="color:'+(p.payoutCents>0?'var(--c-green)':'var(--c-muted2)')+'">'+(p.payoutCents>0?fmt(p.payoutCents/100):'—')+'</span></div>';
  }).join('');
  openSheet('<div class="sheet-title">'+escH(g.dateLabel)+'</div><div class="sheet-sub">'+(g.mode==='winner'?'Winner takes all':'Smart split')+' · '+g.players.length+' players · pot '+fmt(g.potCents/100)+'</div>'+
    rows+
    '<div class="section-lbl" style="margin-top:16px">Round-by-round</div>'+renderRoundMatrix(g)+
    '<button class="btn btn-ghost mt" onclick="closeSheet()">Close</button>');
}

/* ═══════════════ RESUME PROMPT ═══════════════ */
function offerResume(g){
  var act=g.players.filter(function(p){return !p.out;}).length;
  openSheet(
    '<div class="sheet-title">Resume game?</div>'+
    '<div class="sheet-sub">'+g.players.length+' players · hand '+g.round+' · '+act+' still in · pot '+fmt(fromCents(g.potCents))+'</div>'+
    '<button class="btn btn-gold" onclick="resumeGame()">Resume</button>'+
    '<button class="btn btn-ghost mt" onclick="discardResume()">Start fresh</button>'
  );
}
function resumeGame(){
  game=loadGame();closeSheet();stake=fromCents(game.buyCents);_lastPot=null;
  // Migrate older saves that predate the editable timeline so edits still work.
  if(!game.timeline){
    game.starterNames=game.starterNames||game.players.filter(function(p){return !p.laterals;}).map(function(p){return p.name;});
    if(!game.starterNames.length)game.starterNames=game.players.map(function(p){return p.name;});
    game.timeline=(game.hands||[]).map(function(h){return {k:'hand',results:h.results};});
    saveGame();
  }
  renderLive();show('live');startTimer();
}
function discardResume(){clearGame();closeSheet();}

/* ═══════════════ TAP RIPPLE ═══════════════ */
document.addEventListener('pointerdown',function(e){
  var btn=e.target.closest('.btn');
  if(!btn||btn.disabled)return;
  var rect=btn.getBoundingClientRect(),size=Math.max(rect.width,rect.height)*2.2;
  var r=document.createElement('span');r.className='tap-ripple';
  r.style.width=r.style.height=size+'px';r.style.left=(e.clientX-rect.left)+'px';r.style.top=(e.clientY-rect.top)+'px';
  btn.appendChild(r);setTimeout(function(){r.remove();},600);
},{passive:true});

/* ═══════════════ BOOT ═══════════════ */
(function boot(){
  try{var t=localStorage.getItem('rummy-theme');applyTheme(THEMES[t!==null?(parseInt(t,10)%THEMES.length):0]);}catch(e){applyTheme(THEMES[0]);}
  loadRoster();
  buildStakeRow();buildPGrid();
  var g=loadGame();
  if(g)offerResume(g);
})();
window.addEventListener('error',function(e){console.error('[rummy]',e.message);});
