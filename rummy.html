  SUPABASE SQL — Run once in the SQL Editor
  (Project: https://oatuytowzyuneldnoptw.supabase.co — same project as
  the poker app, but dedicated tables. Rummy never reads/writes poker's
  tables and poker never reads/writes these.)
═══════════════════════════════════════════════════════════════

CREATE TABLE IF NOT EXISTS rummy_sessions (
  id           BIGSERIAL PRIMARY KEY,
  session_id   TEXT NOT NULL UNIQUE,
  session_data JSONB NOT NULL,
  played_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

CREATE TABLE IF NOT EXISTS rummy_live_sessions (
  id             BIGSERIAL PRIMARY KEY,
  session_id     TEXT NOT NULL UNIQUE,
  host_device_id TEXT NOT NULL,
  game_state     JSONB NOT NULL,
  started_at     TIMESTAMPTZ NOT NULL DEFAULT NOW(),
  updated_at     TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

ALTER TABLE rummy_sessions      ENABLE ROW LEVEL SECURITY;
ALTER TABLE rummy_live_sessions ENABLE ROW LEVEL SECURITY;

CREATE POLICY "rrds" ON rummy_sessions      FOR SELECT USING (true);
CREATE POLICY "rins" ON rummy_sessions      FOR INSERT WITH CHECK (true);
CREATE POLICY "rdel" ON rummy_sessions      FOR DELETE USING (true);
CREATE POLICY "rlrd" ON rummy_live_sessions FOR SELECT USING (true);
CREATE POLICY "rlin" ON rummy_live_sessions FOR INSERT WITH CHECK (true);
CREATE POLICY "rlup" ON rummy_live_sessions FOR UPDATE USING (true);
CREATE POLICY "rlde" ON rummy_live_sessions FOR DELETE USING (true);
-->
<style>
:root{
  --font-body:'Manrope',system-ui,sans-serif;
  --font-heading:'Chakra Petch',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Fira Mono',monospace;
  --font-logo:'Chakra Petch',system-ui,sans-serif;
  --r-xs:8px; --r-sm:12px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --ease-spring:cubic-bezier(.32,.72,0,1);
  --ease-out:cubic-bezier(.4,0,.2,1);
  --shd:0 1px 12px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.04);
  --shd-lg:0 4px 32px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.05);
  /* set by applyTheme */
  --c-green:#22C55E; --c-red:#EF4444; --c-blue:#3B82F6; --c-orange:#F59E0B;
  --c-gold:#A855F7; --c-gold-rgb:168,85,247; --c-comp:#22D3EE; --c-comp-rgb:34,211,238;
  --c-bg:#0E0620; --c-bg-rgb:14,6,32; --c-bg2:#160A2C; --c-bg3:#1A0E36; --c-bg4:#281652;
  --c-txt:#F4EDFF; --c-txt2:#B9A3E0; --c-muted:#B9A3E0; --c-muted2:rgba(255,255,255,.52);
  --c-surf:rgba(168,85,247,.10); --c-surf2:rgba(168,85,247,.16); --c-surf3:rgba(168,85,247,.24);
  --c-bdr:rgba(168,85,247,.24); --c-bdr2:rgba(168,85,247,.38);
  --hdr-band:linear-gradient(135deg, rgba(168,85,247,.32) 0%, rgba(168,85,247,.10) 45%, rgba(34,211,238,.14) 100%);
  --c-gold-rgb-dark:121,61,178;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--c-gold);outline-offset:3px;border-radius:6px;}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;} }
html{height:100%;font-size:16px;-webkit-text-size-adjust:100%;}
body{background-color:var(--c-bg);color:var(--c-txt);font-family:var(--font-body);min-height:100%;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;}
#bg-photo{position:fixed;inset:0;z-index:-2;opacity:0;transition:opacity .6s ease;pointer-events:none;}
#bg-overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(0,0,0,.72);}
.aurora-drift{animation:auroraDrift 26s ease-in-out infinite alternate;}
@keyframes auroraDrift{0%{background-position:0% 0%,100% 0%,80% 100%,0% 100%,50% 50%}100%{background-position:20% 12%,82% 18%,64% 84%,14% 88%,50% 50%}}
img{max-width:100%;}
svg{vertical-align:middle;}

/* ── HEADER ── */
#app-header{position:fixed;top:0;left:0;right:0;z-index:400;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--hdr-band, none), rgba(3,3,6,.92);
  backdrop-filter:blur(40px) saturate(2);-webkit-backdrop-filter:blur(40px) saturate(2);
  border-bottom:1px solid rgba(var(--c-gold-rgb),.30);
  box-shadow:0 1px 0 rgba(var(--c-gold-rgb),.15), 0 8px 48px rgba(0,0,0,.6);}
.ah-logo-row{display:flex;align-items:center;gap:10px;}
.ah-badge{width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(145deg,var(--c-gold) 0%,var(--c-comp) 100%);
  display:inline-flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 3px 16px rgba(var(--c-gold-rgb),.45), inset 0 1px 0 rgba(255,255,255,.25);
  animation:badgeGlow 3.2s ease-in-out infinite;}
@keyframes badgeGlow{0%,100%{box-shadow:0 3px 16px rgba(var(--c-gold-rgb),.45),inset 0 1px 0 rgba(255,255,255,.25);}
  50%{box-shadow:0 3px 24px rgba(var(--c-gold-rgb),.75),inset 0 1px 0 rgba(255,255,255,.35);}}
@media (prefers-reduced-motion: reduce){.ah-badge{animation:none;}}
.ah-city{font-family:var(--font-logo);font-size:10px;font-weight:600;letter-spacing:3.5px;
  color:rgba(var(--c-gold-rgb),.9);text-transform:uppercase;line-height:1;}
.ah-wordmark{font-family:'Orbitron',var(--font-logo);font-size:17px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(115deg,var(--c-gold) 0%,#fff 50%,var(--c-comp) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;}
.ah-right{display:flex;align-items:center;gap:8px;}
.ah-page{font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:2px;
  color:rgba(255,255,255,.5);text-transform:uppercase;}
.ah-icon-btn{width:40px;height:40px;border-radius:11px;background:rgba(var(--c-gold-rgb),.12);
  border:1.5px solid rgba(var(--c-gold-rgb),.3);color:var(--c-gold);display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:all .15s var(--ease-out);}
.ah-icon-btn:active{transform:scale(.9);}

.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 74px) 16px 120px;}

/* ── SCREENS ── */
.screen{display:none;}
.screen.active{display:block;animation:screenIn .34s var(--ease-spring);}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page-title{font-family:var(--font-heading);font-size:30px;font-weight:700;letter-spacing:-.5px;
  color:var(--c-txt);margin-bottom:4px;line-height:1.15;}
.page-sub{font-family:var(--font-mono);font-size:11px;color:var(--c-muted);margin-bottom:20px;letter-spacing:.3px;}
.section-lbl{font-family:var(--font-body);font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.2px;color:var(--c-muted);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}
.back-btn{background:none;border:none;color:var(--c-muted);font-family:var(--font-body);font-size:14px;
  font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 0;margin-bottom:6px;}

/* ── BUTTONS ── */
.btn{width:100%;padding:16px;border:none;border-radius:16px;font-family:var(--font-body);font-size:16px;
  font-weight:700;cursor:pointer;user-select:none;letter-spacing:.3px;
  transition:all .2s var(--ease-out);display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:var(--shd);position:relative;overflow:hidden;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-gold{background:linear-gradient(135deg, rgb(var(--c-gold-rgb)) 0%, rgb(var(--c-gold-rgb)) 55%, rgb(var(--c-gold-rgb-dark)) 100%);
  color:#fff;border:1.5px solid rgba(var(--c-gold-rgb),.9);font-weight:800;
  box-shadow:0 0 0 1px rgba(var(--c-gold-rgb),.35), 0 6px 24px rgba(var(--c-gold-rgb),.4), 0 1px 0 rgba(255,255,255,.3) inset;}
.btn-green{background:linear-gradient(135deg,#2ED66E,#16A34A);color:#fff;border:1.5px solid rgba(34,197,94,.55);
  box-shadow:0 0 0 1px rgba(34,197,94,.25), 0 6px 22px rgba(34,197,94,.32), 0 1px 0 rgba(255,255,255,.22) inset;}
.btn-red{background:linear-gradient(135deg,#F86464,#DC2626);color:#fff;border:1.5px solid rgba(239,68,68,.55);}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--c-txt);border:1.5px solid rgba(255,255,255,.14);box-shadow:none;}
.btn-sm{padding:11px 16px;font-size:13px;border-radius:12px;width:auto;}
.mt{margin-top:10px;}
.tap-ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(255,255,255,.5) 0%,rgba(255,255,255,.18) 45%,transparent 70%);
  transform:translate(-50%,-50%) scale(0);animation:tapRipple .55s cubic-bezier(.3,.7,.4,1) forwards;}
.btn-gold .tap-ripple{background:radial-gradient(circle,rgba(0,0,0,.26) 0%,rgba(0,0,0,.1) 45%,transparent 70%);}
@keyframes tapRipple{to{transform:translate(-50%,-50%) scale(1);opacity:0;}}
@media (prefers-reduced-motion: reduce){.tap-ripple{display:none;}}

/* ── SETUP: Quick Start (replay last lineup in one tap) ── */
.quick-start-card{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:18px;
  border-radius:16px;border:1.5px solid rgba(var(--c-gold-rgb),.4);cursor:pointer;text-align:left;
  background:linear-gradient(120deg,rgba(var(--c-gold-rgb),.16) 0%,rgba(var(--c-comp-rgb),.08) 100%);
  box-shadow:0 4px 20px rgba(var(--c-gold-rgb),.14);transition:transform .14s var(--ease-out);}
.quick-start-card:active{transform:scale(.98);}
.qs-bolt{flex-shrink:0;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--c-gold),var(--c-comp));color:#fff;
  box-shadow:0 3px 14px rgba(var(--c-gold-rgb),.5);animation:qsPulse 2.4s ease-in-out infinite;}
@keyframes qsPulse{0%,100%{box-shadow:0 3px 14px rgba(var(--c-gold-rgb),.5);}50%{box-shadow:0 3px 22px rgba(var(--c-gold-rgb),.8);}}
.qs-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.qs-title{font-family:var(--font-heading);font-size:15px;font-weight:700;color:var(--c-txt);letter-spacing:.2px;}
.qs-sub{font-family:var(--font-mono);font-size:11.5px;color:var(--c-txt2);}
.qs-avatars{flex-shrink:0;display:flex;}
.qs-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;font-family:var(--font-heading);border:1.5px solid;margin-left:-8px;
  box-shadow:0 0 0 2px var(--c-bg2);}
.qs-av:first-child{margin-left:0;}
.qs-more{background:var(--c-bg4);color:var(--c-txt2);font-size:10px;}
@media (prefers-reduced-motion: reduce){.qs-bolt{animation:none;}}

/* ── SETUP: player grid ── */
.count-pill{font-family:var(--font-mono);font-size:11px;color:var(--c-gold);font-weight:700;
  background:rgba(var(--c-gold-rgb),.14);border-radius:20px;padding:3px 11px;}
.player-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px;}
.p-btn{background:transparent;border:none;padding:10px 4px 8px;display:flex;flex-direction:column;
  align-items:center;gap:6px;text-align:center;position:relative;cursor:pointer;font-family:var(--font-body);
  font-size:11px;font-weight:600;color:var(--c-txt2);border-radius:14px;transition:transform .14s var(--ease-out);}
.p-btn:active{transform:scale(.9);}
.p-btn.on{color:var(--c-txt);}
.p-btn-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;font-family:var(--font-heading);flex-shrink:0;transition:box-shadow .18s ease;position:relative;}
.p-btn.on .p-btn-av{box-shadow:0 0 0 3px var(--c-gold), 0 0 0 6px rgba(var(--c-gold-rgb),.22), 0 6px 20px rgba(var(--c-gold-rgb),.3);}
.p-btn-check{position:absolute;top:-1px;right:-1px;width:18px;height:18px;border-radius:50%;background:var(--c-gold);
  display:none;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.35);}
.p-btn.on .p-btn-check{display:flex;}
.p-btn-name{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;}
.guest-inp{width:100%;padding:12px 14px;background:var(--c-bg3);border:1.5px solid var(--c-bdr2);border-radius:12px;
  color:var(--c-txt);font-family:var(--font-body);font-size:15px;outline:none;box-sizing:border-box;}
.stake-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.stake-chip{padding:9px 16px;border-radius:20px;border:1.5px solid var(--c-bdr2);background:transparent;
  font-family:var(--font-mono);font-size:14px;font-weight:600;cursor:pointer;color:var(--c-muted);transition:all .12s;}
.stake-chip.on{border-color:var(--c-gold);background:rgba(var(--c-gold-rgb),.15);color:var(--c-gold);font-weight:800;}

/* ── LIVE: pot bar — condensed: the "in play / lateral" row now lives INSIDE this
   card as a thin sub-strip, instead of its own separately-margined block below. ── */
.pot-bar{margin-bottom:10px;
  background:linear-gradient(135deg, rgba(var(--c-bg-rgb),.97) 0%, rgba(var(--c-gold-rgb),.10) 100%);
  border:1px solid rgba(var(--c-gold-rgb),.24);border-radius:14px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(var(--c-gold-rgb),.06), 0 4px 20px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);}
.pot-bar-main{display:flex;align-items:center;justify-content:space-between;padding:11px 15px 9px;}
.pot-lbl{font-family:var(--font-body);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;
  color:rgba(var(--c-gold-rgb),.75);margin-bottom:1px;}
.pot-val{font-family:'Orbitron',var(--font-mono);font-size:27px;font-weight:700;letter-spacing:-.5px;color:var(--c-gold);
  line-height:1;text-shadow:0 0 20px rgba(var(--c-gold-rgb),.4);}
.pot-meta{font-family:var(--font-body);font-size:11.5px;color:var(--c-txt2);margin-top:3px;}
.pot-right{text-align:right;}
.pot-timer{font-family:var(--font-mono);font-size:14px;font-weight:800;color:var(--c-gold);letter-spacing:.5px;}
.pot-round{font-family:var(--font-mono);font-size:10.5px;color:var(--c-txt2);margin-top:2px;}
.pot-bar-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 15px;border-top:1px solid rgba(var(--c-gold-rgb),.16);background:rgba(0,0,0,.14);
  font-family:var(--font-mono);font-size:11.5px;color:var(--c-txt2);}
.pot-bar-lateral{border:none;background:none;color:var(--c-comp);font-family:var(--font-mono);
  font-size:11.5px;cursor:pointer;padding:2px 0;font-weight:700;flex-shrink:0;}

/* ── SCOREBOARD TABLE ── */
.drops-info{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:4px;
  border-radius:50%;border:1px solid var(--c-bdr2);background:none;color:var(--c-txt2);
  font-family:var(--font-mono);font-size:9px;font-weight:700;font-style:italic;cursor:pointer;line-height:1;vertical-align:1px;}
.drops-help b{color:var(--c-gold);}
.sb-head{display:grid;grid-template-columns:1fr 42px 44px 32px;gap:9px;padding:0 9px 7px;
  font-family:var(--font-mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  color:var(--c-txt2);align-items:end;}
.sb-head span:not(:first-child){text-align:center;line-height:1.2;}
.sb-row{display:grid;grid-template-columns:1fr 42px 44px 32px;gap:9px;align-items:center;
  padding:12px 9px;border-radius:14px;margin-bottom:7px;position:relative;overflow:hidden;
  background:var(--c-surf);border:1px solid var(--c-bdr);border-left:3px solid transparent;transition:background .2s,border-color .2s;}
/* Eliminated — locked & red, unmistakably "can't play" */
.sb-row.out{background:linear-gradient(90deg,rgba(239,68,68,.12) 0%,rgba(255,255,255,.02) 55%);
  border-color:rgba(239,68,68,.25);border-left-color:var(--c-red);}
.sb-row.out .sb-name{color:rgba(255,255,255,.6);}
.sb-row.out .sb-av{filter:grayscale(.6);opacity:.65;}
/* Must-play — amber, "can play but can't drop" */
.sb-row.mustplay{border-color:rgba(245,158,11,.55);border-left-color:var(--c-orange);
  background:linear-gradient(90deg,rgba(245,158,11,.16) 0%,var(--c-surf) 60%);}
.sb-row.mustplay .sb-av{box-shadow:0 0 0 2px rgba(245,158,11,.5);}
/* Cashed out early — locked in, green, distinct from "eliminated" red */
.sb-row.cashedout{background:linear-gradient(90deg,rgba(34,197,94,.14) 0%,rgba(255,255,255,.02) 55%);
  border-color:rgba(34,197,94,.3);border-left-color:var(--c-green);}
.sb-row.cashedout .sb-av{filter:grayscale(.2);opacity:.9;}
.badge-cashed{font-family:var(--font-mono);font-size:11px;font-weight:800;color:var(--c-green);
  background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);border-radius:8px;padding:3px 7px;letter-spacing:.2px;white-space:nowrap;}
.sb-lock{color:var(--c-red);opacity:.85;}
.sb-name-wrap{display:flex;align-items:center;gap:8px;min-width:0;}
.sb-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-heading);font-size:14px;font-weight:700;flex-shrink:0;border:1.5px solid;box-shadow:0 0 9px -2px currentColor;}
.sb-name{font-size:15px;font-weight:700;color:var(--c-txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-sub{font-family:var(--font-mono);font-size:11px;color:var(--c-txt2);margin-top:2px;letter-spacing:.2px;}
.sb-pts{font-family:var(--font-mono);font-size:20px;font-weight:800;text-align:center;line-height:1;}
.sb-drops{text-align:center;}
.sb-drop-pips{display:flex;gap:3px;justify-content:center;}
.sb-pip{width:7px;height:7px;border-radius:50%;background:var(--c-gold);opacity:.9;}
.sb-drop-num{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--c-txt2);text-align:center;}
.sb-status{display:flex;align-items:center;justify-content:center;}
.badge-must{font-family:var(--font-mono);font-size:9.5px;font-weight:800;color:var(--c-orange);
  background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);border-radius:6px;
  padding:3px 4px;letter-spacing:.2px;line-height:1.2;text-align:center;}
.badge-out{font-family:var(--font-mono);font-size:10px;font-weight:800;color:var(--c-red);
  background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);border-radius:6px;padding:3px 6px;letter-spacing:.3px;}
.streak-dots{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle;}
.streak-dot{width:5px;height:5px;border-radius:50%;background:var(--c-orange);}
/* bust-risk bar — points/201 at a glance, spans the full row under the grid */
.sb-bar-track{grid-column:1 / -1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden;}
.sb-bar-fill{height:100%;border-radius:2px;transition:width .3s var(--ease-out);}
@keyframes numPop{0%{transform:scale(1)}35%{transform:scale(1.4)}65%{transform:scale(.9)}100%{transform:scale(1)}}
.num-pop{animation:numPop .32s cubic-bezier(.34,1.56,.64,1);}

/* ── FLOATING ACTION BAR ── */
.action-bar{position:fixed;bottom:0;left:0;right:0;z-index:300;max-width:520px;margin:0 auto;
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;
  background:rgba(var(--c-bg-rgb),.94);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);
  border-top:1px solid rgba(var(--c-gold-rgb),.24);box-shadow:0 -8px 32px rgba(0,0,0,.5);}

/* ── MODAL / BOTTOM SHEET ── */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:8000;display:flex;align-items:flex-end;
  justify-content:center;padding:0 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--c-bg2);border:1px solid rgba(var(--c-gold-rgb),.3);border-radius:20px 20px 0 0;
  width:100%;max-width:520px;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 22px);
  animation:sheetIn .3s var(--ease-spring);max-height:90vh;overflow-y:auto;}
@keyframes sheetIn{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-title{font-family:var(--font-heading);font-size:20px;font-weight:700;color:var(--c-txt);margin-bottom:4px;}
.sheet-sub{font-family:var(--font-mono);font-size:11px;color:var(--c-muted);margin-bottom:18px;line-height:1.5;}
/* record-hand result picker */
.rh-player{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--c-bdr);}
.rh-player:last-of-type{border-bottom:none;}
.rh-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-heading);font-size:13px;font-weight:700;flex-shrink:0;border:1.5px solid;box-shadow:0 0 8px -2px currentColor;}
.rh-name{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--c-txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rh-opts{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:210px;}
.rh-opt{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:6px 8px;border-radius:9px;
  border:1.5px solid var(--c-bdr2);background:transparent;color:var(--c-muted);cursor:pointer;white-space:nowrap;transition:all .1s;}
.rh-opt.on{border-color:var(--c-gold);background:var(--c-gold);color:#fff;}
.rh-opt.win.on{border-color:var(--c-green);background:var(--c-green);}
.rh-opt.disabled{opacity:.28;cursor:not-allowed;}
.rh-custom{width:52px;padding:6px 4px;border-radius:9px;border:1.5px solid var(--c-bdr2);background:var(--c-bg3);
  color:var(--c-txt);font-family:var(--font-mono);font-size:12px;text-align:center;outline:none;}
.rh-must-note{font-family:var(--font-mono);font-size:11px;color:var(--c-orange);margin-top:3px;}

/* record-hand redesign: winner picker + full-width per-player cards */
.rh-winner-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;}
.rh-winner-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:4px;font-family:var(--font-body);}
.rh-winner-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;font-family:var(--font-heading);transition:box-shadow .15s ease;}
.rh-winner-btn.on .rh-winner-av{box-shadow:0 0 0 3px var(--c-green),0 0 0 6px rgba(34,197,94,.22);}
.rh-winner-name{font-size:11px;font-weight:700;color:var(--c-txt2);max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rh-winner-btn.on .rh-winner-name{color:var(--c-green);}
.rh-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px 10px;margin-bottom:10px;}
.rh-card-top{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.rh-card-pts{font-family:var(--font-mono);font-size:11.5px;color:var(--c-txt2);font-weight:600;margin-left:6px;}
.rh-preview{font-family:var(--font-mono);font-size:13px;font-weight:800;color:var(--c-gold);flex-shrink:0;min-width:52px;text-align:right;}
.rh-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
/* Result tiles — flat, neutral boxes; color lives only in the point value and in
   the filled "selected" state, not as an outline around every box. Single-row
   label+value so the box hugs its content instead of floating in empty padding. */
.rh-opt2{position:relative;padding:14px 10px;border-radius:13px;border:1.5px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.035);cursor:pointer;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;box-sizing:border-box;
  transition:transform .12s var(--ease-out),box-shadow .12s var(--ease-out),background .12s,border-color .12s;}
.rh-opt2:active{transform:scale(.96);}
.rh-opt2-lbl{font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--c-txt2);}
.rh-opt2-val{font-family:var(--font-mono);font-size:16px;font-weight:800;}
.rh-opt2[data-rhtype="drop"] .rh-opt2-val{color:#4ADE80;}
.rh-opt2[data-rhtype="mid"] .rh-opt2-val{color:#FBBF24;}
.rh-opt2[data-rhtype="full"] .rh-opt2-val{color:#F87171;}
.rh-opt2.on{border-color:transparent;color:#fff;box-shadow:0 5px 16px rgba(0,0,0,.3);}
.rh-opt2.on .rh-opt2-lbl{color:rgba(255,255,255,.88);}
.rh-opt2.on .rh-opt2-val{color:#fff;}
.rh-opt2[data-rhtype="drop"].on{background:linear-gradient(135deg,#22C55E,#15803D);}
.rh-opt2[data-rhtype="mid"].on{background:linear-gradient(135deg,#F59E0B,#C2650A);}
.rh-opt2[data-rhtype="full"].on{background:linear-gradient(135deg,#EF4444,#B91C1C);}
.rh-opt2.disabled{opacity:.25;cursor:not-allowed;filter:grayscale(.5);}
.rh-opt2.disabled:active{transform:none;}
.rh-opt2-custom{padding:0;display:flex;align-items:center;border-radius:13px;border:1.5px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);min-height:48px;box-sizing:border-box;transition:border-color .12s,box-shadow .12s;}
.rh-custom2{width:100%;height:100%;padding:0 10px;border-radius:12px;border:none;background:transparent;
  color:var(--c-txt);font-family:var(--font-mono);font-size:14px;font-weight:700;text-align:center;outline:none;box-sizing:border-box;}
.rh-opt2-custom.on{border-color:var(--c-gold);box-shadow:0 0 0 3px rgba(var(--c-gold-rgb),.15);}

/* split result card */
.split-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:12px;
  margin-bottom:8px;background:var(--c-surf);border:1px solid var(--c-bdr);}
.split-payout{font-family:var(--font-mono);font-size:18px;font-weight:800;color:var(--c-green);}
.split-share{font-family:var(--font-mono);font-size:11px;color:var(--c-txt2);}

/* cash-out checklist (Smart Split sheet) — a real toggle, not a stock checkbox,
   with an unmistakable on/off read for a decision made fast mid-game. */
.cashout-row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:14px;margin-bottom:8px;cursor:pointer;
  background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);transition:background .15s var(--ease-out),border-color .15s var(--ease-out),box-shadow .15s var(--ease-out);}
.cashout-row:active{transform:scale(.99);}
.cashout-row.on{background:rgba(34,197,94,.08);box-shadow:0 2px 12px rgba(34,197,94,.1);}
.cashout-native{position:absolute;opacity:0;width:1px;height:1px;}
.cashout-check{width:23px;height:23px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--c-bdr2);background:transparent;transition:all .15s var(--ease-out);}
.cashout-check svg{opacity:0;transform:scale(.5);transition:all .15s var(--ease-out);}
.cashout-row.on .cashout-check{background:var(--c-green);border-color:var(--c-green);box-shadow:0 2px 10px rgba(34,197,94,.45);}
.cashout-row.on .cashout-check svg{opacity:1;transform:scale(1);}
.cashout-info{flex:1;min-width:0;}
.cashout-name{font-size:14.5px;font-weight:700;color:var(--c-txt);display:block;}
.cashout-meta{font-family:var(--font-mono);font-size:11px;color:var(--c-txt2);}
.cashout-right{text-align:right;flex-shrink:0;}
.cashout-amt{font-family:var(--font-mono);font-size:19px;font-weight:800;color:var(--c-green);line-height:1;display:block;}
.cashout-tag{font-family:var(--font-body);font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-top:3px;color:var(--c-txt2);}
.cashout-row.on .cashout-tag{color:var(--c-green);}

/* ── NOTIF ── */
#notif{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:12px;right:12px;
  transform:translateY(-140%) scale(.96);opacity:0;border-radius:16px;padding:13px 15px;
  font-family:var(--font-body);font-size:13.5px;font-weight:600;z-index:9999;
  transition:transform .38s cubic-bezier(.34,1.56,.64,1),opacity .25s ease;text-align:left;
  display:flex;align-items:center;gap:11px;max-width:490px;margin:0 auto;line-height:1.35;
  box-shadow:0 8px 32px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25);pointer-events:none;}
#notif.show{transform:translateY(0) scale(1);opacity:1;}
#notif .notif-icon{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);color:#fff;}
#notif .notif-text{flex:1;min-width:0;}
#notif.ok{background:linear-gradient(135deg,#059669,#10B981);border:1px solid rgba(110,255,190,.65);color:#fff;}
#notif.err{background:linear-gradient(135deg,#DC2626,#F43F5E);border:1px solid rgba(255,150,160,.65);color:#fff;}
#notif.warn{background:linear-gradient(135deg,#D97706,#F59E0B);border:1px solid rgba(255,210,130,.7);color:#fff;}
#notif.info{background:linear-gradient(135deg,#2563EB,#38BDF8);border:1px solid rgba(150,205,255,.65);color:#fff;}

.empty-wrap{text-align:center;padding:50px 20px;}
.empty-emoji{font-size:50px;margin-bottom:14px;}
.pill-info{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;
  color:var(--c-txt2);background:rgba(255,255,255,.04);border:1px solid var(--c-bdr);border-radius:20px;padding:7px 12px;line-height:1.4;}
.link-back{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;
  color:var(--c-comp);text-decoration:none;background:rgba(var(--c-comp-rgb),.1);border:1px solid rgba(var(--c-comp-rgb),.25);
  border-radius:10px;padding:7px 12px;}
/* ── Round-by-round matrix ── */
.rmx-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--c-bdr);}
.rmx{border-collapse:collapse;width:100%;font-family:var(--font-mono);font-size:15px;min-width:100%;}
.rmx th,.rmx td{padding:11px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--c-bdr);}
.rmx thead th{position:sticky;top:0;background:var(--c-bg2);color:var(--c-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;z-index:1;}
.rmx th.rmx-h,.rmx td.rmx-h{position:sticky;left:0;background:var(--c-bg2);text-align:left;padding-left:12px;z-index:2;font-weight:700;color:var(--c-txt);}
.rmx thead th.rmx-h{z-index:3;}
.rmx td.rmx-win{color:var(--c-green);font-weight:800;}
.rmx td.rmx-drop{color:var(--c-orange);}
.rmx td.rmx-zero{color:var(--c-muted2);}
.rmx tbody tr:nth-child(even) td{background:rgba(255,255,255,.02);}
.rmx tfoot td{border-top:2px solid var(--c-bdr2);font-weight:800;color:var(--c-txt);background:var(--c-bg2);}
.rmx tfoot td.out{color:var(--c-red);}
.rmx-legend{font-family:var(--font-mono);font-size:11px;color:var(--c-txt2);margin-top:12px;display:flex;gap:14px;flex-wrap:wrap;}
.rmx-edit{background:rgba(var(--c-gold-rgb),.16);border:1px solid rgba(var(--c-gold-rgb),.4);color:var(--c-gold);
  font-family:var(--font-mono);font-size:13px;font-weight:800;padding:4px 8px;border-radius:8px;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;}
.rmx-edit:active{transform:scale(.92);}
/* ── Stats screen ── */
.stat-kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.stat-kpi{position:relative;overflow:hidden;text-align:center;padding:12px 8px;border-radius:14px;
  border:1px solid rgba(255,255,255,.1);border-bottom:2px solid rgba(var(--c-gold-rgb),.5);
  background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,transparent 24%),linear-gradient(160deg,rgba(var(--c-gold-rgb),.12) 0%,var(--c-bg2) 62%);
  box-shadow:0 4px 16px rgba(0,0,0,.3);}
.stat-kpi-val{font-family:var(--font-mono);font-size:19px;font-weight:800;color:var(--c-txt);line-height:1;}
.stat-kpi-lbl{font-family:var(--font-body);font-size:10.5px;color:var(--c-txt2);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;}
.lb-row{display:grid;grid-template-columns:26px 34px 1fr auto;gap:9px;align-items:center;padding:9px 12px;border-radius:12px;margin-bottom:5px;background:var(--c-surf);border:1px solid var(--c-bdr);}
.lb-rank{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--c-muted);text-align:center;}
.lb-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:14px;font-weight:700;border:1.5px solid;box-shadow:0 0 8px -2px currentColor;}
.lb-net{font-family:var(--font-mono);font-size:15px;font-weight:800;}
.lb-bar-track{height:5px;border-radius:3px;background:rgba(255,255,255,.06);margin-top:5px;overflow:hidden;}
.lb-bar-fill{height:100%;border-radius:3px;}
.hist-card{background:var(--c-surf);border:1px solid var(--c-bdr);border-radius:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hist-date{font-family:var(--font-mono);font-size:11px;color:var(--c-txt2);}
.hist-win{font-size:14px;font-weight:700;color:var(--c-txt);}
</style>
</head>
<body>
<div id="bg-photo" aria-hidden="true"></div>
<div id="bg-overlay" aria-hidden="true"></div>

<header id="app-header">
  <div class="ah-logo-row">
    <span class="ah-badge" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" stroke="none"><path d="M12 2c-1.5 3-4 4.5-7 5 3 .5 5.5 2 7 5 1.5-3 4-4.5 7-5-3-.5-5.5-2-7-5z"/><circle cx="6" cy="17" r="2.4"/><circle cx="18" cy="17" r="2.4"/></svg>
    </span>
    <div style="display:flex;flex-direction:column;gap:1px">
      <span class="ah-city">HUTTO</span>
      <span class="ah-wordmark">RUMMY</span>
    </div>
  </div>
  <div class="ah-right">
    <span class="ah-page" id="ah-page"></span>
    <button class="ah-icon-btn" onclick="openStats()" title="Stats &amp; history" aria-label="Stats and history">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="13"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="9"/></svg>
    </button>
    <button class="ah-icon-btn" onclick="cycleTheme()" title="Change theme" aria-label="Change theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/><path d="M12 2a10 10 0 1 0 0 20 2.5 2.5 0 0 0 2-4 2.5 2.5 0 0 1 2-4h2a4 4 0 0 0 4-4 10 10 0 0 0-10-8z"/></svg>
    </button>
  </div>
</header>

<div id="notif"></div>

<div class="wrap">

  <!-- ══ SETUP ══ -->
  <div id="screen-setup" class="screen active">
    <div class="page-title">Rummy 201</div>
    <div class="page-sub">First to 201 is out · smart-split the final three</div>

    <div id="quick-start-slot"></div>

    <div class="section-lbl"><span>Who's Playing</span><span class="count-pill" id="sel-count">0 selected</span></div>
    <div class="player-grid" id="p-grid"></div>

    <div style="margin-bottom:20px">
      <div style="display:flex;gap:8px;align-items:center">
        <input class="guest-inp" id="guest-inp" type="text" placeholder="Add a one-time guest…" autocomplete="off" onkeydown="if(event.key==='Enter')addGuest()"/>
        <button class="btn btn-ghost btn-sm" style="flex-shrink:0" onclick="addGuest()">Add</button>
      </div>
    </div>

    <div class="section-lbl"><span>Stake per player</span></div>
    <div class="stake-row" id="stake-row"></div>

    <button class="btn btn-gold" id="start-btn" onclick="startGame()" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg> Start Game
    </button>
    <button class="btn btn-ghost mt" onclick="openStats()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="13"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="9"/></svg> Stats &amp; History
    </button>
  </div>

  <!-- ══ LIVE ══ -->
  <div id="screen-live" class="screen">
    <div id="live-pot"></div>
    <div class="sb-head"><span>Player</span><span>Points</span><span>Drops<br>left<button class="drops-info" onclick="notify('Drops left = how many more 20-pt initial drops before busting at 201','info')" aria-label="What is drops left?">i</button></span><span></span></div>
    <div id="scoreboard"></div>
    <div id="split-slot" style="margin-top:12px"></div>
  </div>

  <!-- ══ RESULTS ══ -->
  <div id="screen-results" class="screen"></div>

  <!-- ══ STATS / HISTORY ══ -->
  <div id="screen-stats" class="screen"></div>

</div>

<!-- action bar (live only) -->
<div class="action-bar" id="action-bar" style="display:none">
  <button class="btn btn-ghost" style="flex:1;padding:14px 8px;font-size:14px" onclick="goSetupConfirm()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> Exit
  </button>
  <button class="btn btn-ghost" style="flex:1;padding:14px 8px;font-size:14px" onclick="openRounds()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> Rounds
  </button>
  <button class="btn btn-gold" style="flex:1.7;padding:14px 8px" onclick="openRecordHand()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Record
  </button>
</div>

<div id="sheet-root"></div>

<script>
/* ═══════════════ CONSTANTS ═══════════════ */
var CORE = ['Abhinay','Abhishek','Deepak','Ganesh','Kiran','Kishore','Krishna',
            'Murali','Navaneeth','Ram','Rishi','Santhosh','Siva','Vaasant','Vinay'];
var STAKES = [5, 10, 20, 25, 50];

function hexToRgb(hex){return parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16);}
function _relLum(r,g,b){var f=function(c){c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);};return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);}
function _contrastRatio(a,b){var l1=_relLum(a[0],a[1],a[2]),l2=_relLum(b[0],b[1],b[2]);return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);}
function _hexArr(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function _arrHex(a){return '#'+a.map(function(c){return Math.max(0,Math.min(255,Math.round(c))).toString(16).padStart(2,'0');}).join('');}
function ensureContrast(fg,bg,t){var f=_hexArr(fg),b=_hexArr(bg);for(var i=0;i<24&&_contrastRatio(f,b)<t;i++){f=f.map(function(c){return c+(255-c)*0.10;});}return _arrHex(f);}

    'radial-gradient(ellipse 60% 50% at 12% 8%,rgba('+ar+',.40) 0%,transparent 55%)',
    'radial-gradient(ellipse 55% 45% at 92% 18%,rgba('+cr+',.30) 0%,transparent 52%)',
    'radial-gradient(ellipse 60% 55% at 82% 92%,rgba('+ar+',.28) 0%,transparent 55%)',
    'radial-gradient(ellipse 50% 45% at 18% 88%,rgba('+cr+',.22) 0%,transparent 52%)',
    'radial-gradient(ellipse at 50% 50%,rgba('+br+',0) 12%,rgba('+br+',.55) 66%,rgba('+br+',.94) 100%)'
  ].join(',');
  el.style.backgroundSize='160% 160%,150% 150%,165% 165%,150% 150%,100% 100%';
  el.style.opacity='1';el.classList.add('aurora-drift');
}

  r.setProperty('--c-comp',theme.comp);r.setProperty('--c-comp-rgb',cRgb);

  r.setProperty('--c-bg',bg);r.setProperty('--c-bg-rgb',bA[0]+','+bA[1]+','+bA[2]);
  r.setProperty('--c-bg2',theme.s1.replace('0.88','0.96'));r.setProperty('--c-bg3',theme.s1);r.setProperty('--c-bg4',theme.s2);
  r.setProperty('--c-txt',gText);r.setProperty('--c-txt2',gTextSub);r.setProperty('--c-muted',gTextSub);r.setProperty('--c-muted2','rgba(255,255,255,0.68)');
  r.setProperty('--c-surf','rgba('+aRgb+',.10)');r.setProperty('--c-surf2','rgba('+aRgb+',.16)');r.setProperty('--c-surf3','rgba('+aRgb+',.24)');
  r.setProperty('--c-bdr','rgba('+aRgb+',.24)');r.setProperty('--c-bdr2','rgba('+aRgb+',.38)');
  r.setProperty('--hdr-band','linear-gradient(135deg,rgba('+aRgb+',.32) 0%,rgba('+aRgb+',.10) 45%,rgba('+cRgb+',.14) 100%)');
  document.body.style.backgroundColor=bg;document.body.style.backgroundImage=theme.pattern;document.body.style.backgroundSize=theme.patternSize;document.body.style.backgroundRepeat='repeat';
  var ov=document.getElementById('bg-overlay');if(ov)ov.style.background=theme.overlay;
  loadThemePhoto(theme);
  var mtc=document.querySelector('meta[name="theme-color"]');if(mtc)mtc.content=bg;
}

/* ═══════════════ RUMMY ENGINE (identical to test_rummy.js) ═══════════════ */
var RUMMY_LIMIT=201, ALIVE_MAX=200, DROP_UNIT=20, MID_DROP=40, FULL_COUNT=80, MAX_PLAYERS=8, MUST_PLAY_OVER=180;
function rDropChoices(points){return Math.max(0,Math.floor((ALIVE_MAX-points)/DROP_UNIT));}
function rIsEliminated(points){return points>=RUMMY_LIMIT;}
function rIsMustPlay(points,streak){return points>MUST_PLAY_OVER||streak>=3;}
function rLateralEntryPoints(activePointsArr){if(!activePointsArr.length)return 1;var hi=Math.max.apply(null,activePointsArr);var pts=hi+1;return pts>=RUMMY_LIMIT?null:pts;}
function rDistribute(potCents,weights){var total=weights.reduce(function(a,b){return a+b;},0);if(total<=0)return weights.map(function(){return 0;});var raw=weights.map(function(w){return potCents*w/total;});var out=raw.map(function(x){return Math.floor(x);});var used=out.reduce(function(a,b){return a+b;},0);var rem=potCents-used;var order=raw.map(function(x,i){return {i:i,f:x-Math.floor(x)};}).sort(function(a,b){return b.f-a.f||a.i-b.i;});for(var k=0;k<rem;k++)out[order[k%order.length].i]++;return out;}
function rSplitEligible(activePointsArr){var n=activePointsArr.length;if(n===3)return activePointsArr.every(function(p){return rDropChoices(p)<=2;});if(n===2)return true;return false;}
function rSplitWeights(activePointsArr){return activePointsArr.map(function(p){return rDropChoices(p)+1;});}
function rSplitPayoutCents(potCents,activePointsArr){return rDistribute(potCents,rSplitWeights(activePointsArr));}
/* $5-denominated split: every share lands on a multiple of 500 cents (sum still exact). */
function rDistributeStep(potCents,weights,stepCents){
  stepCents=stepCents||1;
  var total=weights.reduce(function(a,b){return a+b;},0);
  if(total<=0)return weights.map(function(){return 0;});
  var steps=Math.floor(potCents/stepCents);
  var remainderCents=potCents-steps*stepCents;
  var raw=weights.map(function(w){return steps*w/total;});
  var out=raw.map(function(x){return Math.floor(x);});
  var used=out.reduce(function(a,b){return a+b;},0);
  var rem=steps-used;
  var order=raw.map(function(x,i){return {i:i,f:x-Math.floor(x)};}).sort(function(a,b){return b.f-a.f||a.i-b.i;});
  for(var k=0;k<rem;k++)out[order[k%order.length].i]++;
  var outCents=out.map(function(s){return s*stepCents;});
  if(remainderCents>0){
    var maxIdx=0;for(var i=1;i<weights.length;i++)if(weights[i]>weights[maxIdx])maxIdx=i;
    outCents[maxIdx]+=remainderCents;
  }
  return outCents;
}
function rSplitPayoutCents5(potCents,activePointsArr){return rDistributeStep(potCents,rSplitWeights(activePointsArr),500);}
/* money */
function cents(v){return Math.round(v*100);}
function fromCents(c){return c/100;}
function fmt(v){var n=Math.abs(Math.round(v*100)/100);return Number.isInteger(n)?'$'+n:'$'+n.toFixed(2);}

function buildStakeRow(){
  document.getElementById('stake-row').innerHTML=STAKES.map(function(v){
    return '<button class="stake-chip'+(v===stake?' on':'')+'" onclick="setStake('+v+')">$'+v+'</button>';
  }).join('')+'<button class="stake-chip" onclick="customStake()">Other</button>';
}
function setStake(v){stake=v;buildStakeRow();haptic('light');}
function customStake(){
  var v=prompt('Stake per player ($):','10');if(v===null)return;
  var n=Math.round(parseFloat(v)*100)/100;
  if(!n||isNaN(n)||n<1||n>9999){notify('Enter $1–$9999','err');return;}
  stake=n;STAKES.indexOf(n)<0&&STAKES.push(n);buildStakeRow();
}
function buildPGrid(){
  var all=roster.concat(guests.filter(function(g){return roster.indexOf(g)<0;}));
  document.getElementById('p-grid').innerHTML=all.map(function(name){
    var on=selected.indexOf(name)>=0;var pal=nameColor(name);
    var isG=guests.indexOf(name)>=0&&roster.indexOf(name)<0;
    return '<button class="p-btn'+(on?' on':'')+'" onclick="togglePlayer(\''+escQ(name)+'\')">'+
      '<div class="p-btn-av" style="background:'+(on?'rgba('+pal.rgb+',1)':'rgba('+pal.rgb+',.18)')+';color:'+(on?'#fff':pal.hex)+'">'+
        '<span class="p-btn-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>'+
        escH(name.charAt(0).toUpperCase())+'</div>'+

  try{var s=JSON.parse(localStorage.getItem('rummy-last-setup')||'null');if(s&&Array.isArray(s.names)&&s.names.length>=2&&typeof s.stake==='number')return s;}catch(e){}

function renderQuickStart(){
  var slot=document.getElementById('quick-start-slot');
  if(!slot)return;
  var s=loadLastSetup();
  var sameAsCurrent=s&&selected.length===s.names.length&&s.names.every(function(n){return selected.indexOf(n)>=0;});
  if(!s||sameAsCurrent){slot.innerHTML='';return;}
  var avatars=s.names.slice(0,5).map(function(n){var pal=nameColor(n);return '<span class="qs-av" style="background:rgba('+pal.rgb+',.28);color:'+pal.hex+';border-color:rgba('+pal.rgb+',.55)">'+escH(n.charAt(0).toUpperCase())+'</span>';}).join('');

  slot.innerHTML='<button class="quick-start-card" onclick="quickStart()">'+
    '<span class="qs-bolt"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 11 14 9 22 21 10 13 10 13 2"/></svg></span>'+

    '<span class="qs-avatars">'+avatars+more+'</span>'+

}
function quickStart(){
  var s=loadLastSetup();if(!s)return;
  s.names.forEach(function(n){ if(roster.indexOf(n)<0&&guests.indexOf(n)<0)guests.push(n); });
  selected=s.names.slice();
  stake=s.stake;if(STAKES.indexOf(stake)<0)STAKES.push(stake);
  buildPGrid();buildStakeRow();
  haptic('success');
  startGame();
}
function togglePlayer(name){
  var i=selected.indexOf(name);
  if(i>=0)selected.splice(i,1);
  else{ if(selected.length>=MAX_PLAYERS){notify('Max '+MAX_PLAYERS+' players','warn');return;} selected.push(name); }
  haptic('light');buildPGrid();
}
function addGuest(){
  var inp=document.getElementById('guest-inp');var name=inp.value.trim();
  if(!name)return;
  if(roster.concat(guests).some(function(n){return n.toLowerCase()===name.toLowerCase();})){notify('Name already exists','warn');inp.value='';return;}
  guests.push(name);inp.value='';
  if(selected.length<MAX_PLAYERS)selected.push(name);
  buildPGrid();
}

function startGame(){
  if(selected.length<2){notify('Pick at least 2 players','err');return;}
  saveLastSetup();
  game={
    starterNames:selected.slice(),
    players:selected.map(function(n){return {name:n,points:0,streak:0,mustPlay:false,out:false,cashedOut:false,cashedOutCents:0,laterals:0};}),
    buyCents:cents(stake),
    potCents:cents(stake)*selected.length,
    starters:selected.length,
    lateralCount:0,
    timeline:[],   // ordered events: {k:'hand',results:[...]} | {k:'lateral',name}
    hands:[],      // derived from timeline (for the round matrix)
    round:0,
    startedAt:Date.now(),
    endedAt:null,
    ended:false
  };
  _lastPot=null;
  saveGame();
  haptic('success');
  renderLive();show('live');
  startTimer();
  dbCreateRummyLiveSession(String(game.startedAt),game).then(function(ok){
    if(!ok)notify('⚠️ Live sync unavailable — run the Rummy SQL script in Supabase to enable it','warn');
  });
}

/* history (finished games) */
async function dbInsertRummySession(s){await sbPost('rummy_sessions',{session_id:String(s.id),session_data:s,played_at:new Date().toISOString()});}
async function dbLoadRummySessions(){
  try{var rows=await sbGet('rummy_sessions?select=session_data,played_at&order=played_at.asc');return rows.map(function(r){return r.session_data;}).filter(Boolean);}
  catch(e){console.warn('[rummy-cloud] sessions load failed:',e.message);return null;}
}
function mergeRummySessions(localArr,cloudArr){
  var byId={};
  (cloudArr||[]).forEach(function(s){if(s&&s.id!=null)byId[String(s.id)]=s;});
  (localArr||[]).forEach(function(s){if(s&&s.id!=null&&!byId[String(s.id)])byId[String(s.id)]=s;});
  var merged=Object.keys(byId).map(function(k){return byId[k];});
  merged.sort(function(a,b){return (Number(b.id)||0)-(Number(a.id)||0);}); // newest first (matches loadHistory's unshift order)
  return merged;
}
async function backfillMissingRummySessions(localArr,cloudArr){
  var cloudIds={};(cloudArr||[]).forEach(function(s){if(s&&s.id!=null)cloudIds[String(s.id)]=1;});
  var missing=(localArr||[]).filter(function(s){return s&&s.id!=null&&!cloudIds[String(s.id)];});
  var pushed=0;
  for(var i=0;i<missing.length;i++){ try{await dbInsertRummySession(missing[i]);pushed++;}catch(e){console.warn('[rummy-cloud] backfill failed for',missing[i].id,e.message);} }
  return pushed;
}
async function syncRummyHistory(){
  try{
    var cloud=await dbLoadRummySessions();
    if(cloud===null)return false;
    var localArr=loadHistory();
    var merged=mergeRummySessions(localArr,cloud);
    if(merged.length>200)merged=merged.slice(0,200);
    saveHistoryArr(merged);
    var pushed=await backfillMissingRummySessions(localArr,cloud);
    if(pushed)notify('☁️ Synced '+pushed+' local game'+(pushed>1?'s':'')+' to the cloud','ok');
    return true;
  }catch(e){console.warn('[rummy-cloud] sync failed:',e.message);return false;}
}

/* Debounced fire-and-forget push so a burst of saveGame() calls doesn't spam the network. */
var _liveSyncTimer=null,_liveSyncPending=false;
function pushLiveSync(){
  if(!game||game.ended)return;
  _liveSyncPending=true;
  if(_liveSyncTimer)return;
  _liveSyncTimer=setTimeout(function(){
    _liveSyncTimer=null;
    if(!_liveSyncPending||!game||game.ended)return;
    _liveSyncPending=false;
    dbCreateRummyLiveSession(String(game.startedAt),game);
  },800);
}

/* ═══════════════ TIMER ═══════════════ */
var timerIv=null;
function startTimer(){stopTimer();timerIv=setInterval(updateTimer,1000);updateTimer();}
function stopTimer(){if(timerIv){clearInterval(timerIv);timerIv=null;}}
function updateTimer(){
  if(!game)return;var el=document.getElementById('g-timer');if(!el)return;
  var s=Math.floor((Date.now()-game.startedAt)/1000);
  var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
  el.textContent=(h>0?h+'h ':'')+m+'m '+String(ss).padStart(2,'0')+'s';
}

/* ═══════════════ LIVE / SCOREBOARD ═══════════════ */
function activePlayers(){return game.players.filter(function(p){return !p.out&&!p.cashedOut;});}
function refreshMustPlay(){game.players.forEach(function(p){p.mustPlay=!p.out&&!p.cashedOut&&rIsMustPlay(p.points,p.streak);});}

function renderLive(){
  refreshMustPlay();
  var act=activePlayers();
  var pot=game.potCents;
  var cashedOutN=game.players.filter(function(p){return p.cashedOut;}).length;
  var outN=game.players.filter(function(p){return p.out;}).length;
  document.getElementById('live-pot').innerHTML=
    '<div class="pot-bar">'+
      '<div class="pot-bar-main"><div>'+
        '<div class="pot-lbl">Prize Pot</div>'+
        '<div class="pot-val" id="pot-val">'+fmt(fromCents(pot))+'</div>'+
        '<div class="pot-meta">'+fmt(stake)+' / player'+(game.lateralCount?' · '+game.lateralCount+' lateral':'')+'</div>'+
      '</div><div class="pot-right">'+
        '<div class="pot-timer" id="g-timer">0m 00s</div>'+
        '<div class="pot-round">Hand '+game.round+' · '+act.length+' left</div>'+
      '</div></div>'+
      '<div class="pot-bar-sub">'+
        '<span>'+act.length+' in play'+(cashedOutN?' · '+cashedOutN+' cashed out':'')+(outN?' · '+outN+' out':'')+'</span>'+
        '<button class="pot-bar-lateral" onclick="openLateral()">+ Lateral entry</button>'+
      '</div>'+
    '</div>';

  // sort: active by points asc (leaders first), then cashed-out, then out — all by points asc
  var order=game.players.slice().sort(function(a,b){
    var ra=a.out?2:(a.cashedOut?1:0), rb=b.out?2:(b.cashedOut?1:0);
    if(ra!==rb)return ra-rb;
    return a.points-b.points;
  });
  document.getElementById('scoreboard').innerHTML=order.map(function(p){return sbRow(p);}).join('');

  // pot count-up on change
  if(typeof _lastPot==='number'&&_lastPot!==pot){animateMoney(document.getElementById('pot-val'),fromCents(_lastPot),fromCents(pot),420);}
  _lastPot=pot;

  renderSplitSlot();
}

  var cls='sb-row'+(p.out?' out':'')+(p.cashedOut?' cashedout':'')+(p.mustPlay?' mustplay':'');

  var sub;
  if(p.out)sub='eliminated'+(p.laterals?' · re-entered '+p.laterals+'×':'');
  else if(p.cashedOut)sub='cashed out early';
  else sub=(200-p.points)+' to bust'+(p.laterals?' · re-entered':'');
  var ptsColor=p.out?'var(--c-red)':(p.cashedOut?'var(--c-green)':(p.points>MUST_PLAY_OVER?'var(--c-orange)':'var(--c-txt)'));
  var mid;
  if(p.out)mid='<span class="badge-out">OUT</span>';
  else if(p.cashedOut)mid='<span class="badge-cashed">'+fmt(fromCents(p.cashedOutCents))+'</span>';
  else{
    // drop pips (max 4) or number
    if(dc<=4){var pips='';for(var d=0;d<dc;d++)pips+='<span class="sb-pip"></span>';mid=dc>0?'<div class="sb-drop-pips">'+pips+'</div>':'<div class="sb-drop-num" style="color:var(--c-orange)">0</div>';}
    else mid='<div class="sb-drop-num">'+dc+'</div>';
  }
  var statusCell='';
  if(p.out)statusCell='<span class="sb-lock" title="Eliminated — out of the game"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>';
  else if(p.cashedOut)statusCell='<span title="Cashed out — locked in and left the table">💰</span>';
  else if(p.mustPlay)statusCell='<span class="badge-must">MUST<br>PLAY</span>';
  var lockIco=p.out?'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--c-red)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-left:2px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>':'';
  var barPct=Math.min(100,Math.round(p.points/RUMMY_LIMIT*100));
  var barColor=p.out?'var(--c-red)':(p.cashedOut?'var(--c-green)':(p.points>MUST_PLAY_OVER?'var(--c-orange)':(p.points>=100?'#EAB308':'var(--c-green)')));
  return '<div class="'+cls+'" data-player="'+escH(p.name)+'">'+

      '<div style="min-width:0"><div class="sb-name">'+escH(p.name)+streakDots+lockIco+'</div><div class="sb-sub">'+sub+'</div></div>'+
    '</div>'+
    '<div class="sb-pts" style="color:'+ptsColor+'" data-pts="'+escH(p.name)+'">'+p.points+'</div>'+
    '<div class="sb-drops">'+mid+'</div>'+
    '<div class="sb-status">'+statusCell+'</div>'+
    '<div class="sb-bar-track"><div class="sb-bar-fill" style="width:'+barPct+'%;background:'+barColor+'"></div></div>'+
  '</div>';
}

function animateMoney(el,from,to,ms){
  if(!el)return;ms=ms||600;
  var toC=Math.round(to*100),fromC=Math.round(from*100);
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches||toC===fromC){el.textContent=fmt(to);return;}
  var tok=(el.__t=(el.__t||0)+1),t0=performance.now(),ease=function(x){return 1-Math.pow(1-x,3);};
  (function fr(now){if(el.__t!==tok)return;var pr=Math.min((now-t0)/ms,1);el.textContent=fmt((fromC+(toC-fromC)*ease(pr))/100);if(pr<1)requestAnimationFrame(fr);else el.textContent=fmt(to);})(t0);
  setTimeout(function(){if(el.__t===tok)el.textContent=fmt(to);},ms+120);
}

/* ═══════════════ SPLIT SLOT (shown when 3 or 2 remain) ═══════════════ */
function renderSplitSlot(){
  var slot=document.getElementById('split-slot');
  var act=activePlayers();
  if(game.ended){slot.innerHTML='';return;}
  if(act.length===1){
    slot.innerHTML='<button class="btn btn-green" onclick="finishWinner()">🏆 '+escH(act[0].name)+' wins — Settle '+fmt(fromCents(game.potCents))+'</button>';
    return;
  }
  if(act.length===3){
    var pts=act.map(function(p){return p.points;});
    if(rSplitEligible(pts)){
      slot.innerHTML='<button class="btn btn-gold" onclick="openSplit()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 7h20M2 17h20"/></svg> Smart Split / Cash Out available</button>';
    }else{
      var lead=act.slice().sort(function(a,b){return a.points-b.points;})[0];
      slot.innerHTML='<div class="pill-info" style="width:100%;justify-content:center;box-sizing:border-box">Split locked — '+escH(lead.name)+' still has '+rDropChoices(lead.points)+' drop choices (need ≤2 all round)</div>';
    }
    return;
  }
  if(act.length===2){
    slot.innerHTML='<button class="btn btn-gold" onclick="openSplit()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 7h20M2 17h20"/></svg> End now — split or play on</button>';
    return;
  }
  slot.innerHTML='';
}

/* ═══════════════ RECORD HAND ═══════════════
   Two clear steps instead of one cramped row: (1) tap the winner, big avatar picker;
   (2) each remaining player gets a full-width card with large 2×2 result buttons and
   a live "→ N pts" preview, instead of 4 tiny pills + a tiny number field squeezed
   onto one line. */
var rhChoices={}; // name -> {type, custom}
function openRecordHand(){
  var act=activePlayers();
  if(act.length<2){notify('Not enough players','warn');return;}
  rhChoices={};
  act.forEach(function(p){rhChoices[p.name]={type:null,custom:''};});
  renderRecordHandSheet();
}
function rhAddFor(ch){
  if(!ch||!ch.type)return 0;
  if(ch.type==='drop')return DROP_UNIT;
  if(ch.type==='mid')return MID_DROP;
  if(ch.type==='full')return FULL_COUNT;
  if(ch.type==='played')return (+ch.custom||0);
  return 0;
}
function renderRecordHandSheet(){
  var act=activePlayers();
  var winnerName=null;
  act.forEach(function(p){if(rhChoices[p.name]&&rhChoices[p.name].type==='win')winnerName=p.name;});

  var winnerRow='<div class="rh-winner-row">'+act.map(function(p){
    var pal=nameColor(p.name);var on=p.name===winnerName;
    return '<button class="rh-winner-btn'+(on?' on':'')+'" onclick="rhSetWinner(\''+escQ(p.name)+'\')">'+
      '<span class="rh-winner-av" style="background:'+(on?'rgba('+pal.rgb+',1)':'rgba('+pal.rgb+',.18)')+';color:'+(on?'#fff':pal.hex)+'">'+escH(p.name.charAt(0).toUpperCase())+'</span>'+
      '<span class="rh-winner-name">'+escH(p.name)+'</span>'+
    '</button>';
  }).join('')+'</div>';

  var others=act.filter(function(p){return p.name!==winnerName;});
  var body=winnerName
    ? '<div class="section-lbl" style="margin-top:16px">Everyone else — tap each result</div>'+others.map(function(p){return rhCard(p);}).join('')
    : '<div class="pill-info" style="width:100%;justify-content:center;box-sizing:border-box;margin-top:6px">Pick the winner above first</div>';

  var allSet=!!winnerName&&others.every(function(p){return rhChoices[p.name]&&rhChoices[p.name].type;});

  openSheet(
    '<div class="sheet-title">Record Hand '+(game.round+1)+'</div>'+
    '<div class="sheet-sub">1. Tap the winner. 2. Set everyone else&rsquo;s result.</div>'+
    '<div class="section-lbl">Who won?</div>'+
    winnerRow+body+
    '<div style="display:flex;gap:8px;margin-top:18px">'+
      '<button class="btn btn-ghost" style="flex:1" onclick="closeSheet()">Cancel</button>'+
      '<button class="btn btn-gold" id="rh-save-btn" style="flex:2" '+(allSet?'':'disabled')+' onclick="commitHand()">Save Hand</button>'+
    '</div>'
  );
}
function rhCard(p){
  var pal=nameColor(p.name);var mp=p.mustPlay;
  var ch=rhChoices[p.name]||{type:null,custom:''};
  var add=rhAddFor(ch);
  var preview=ch.type?'→ '+(p.points+add)+' pts':'';
  return '<div class="rh-card" data-rh="'+escH(p.name)+'">'+
    '<div class="rh-card-top">'+
      '<span class="rh-av" style="background:rgba('+pal.rgb+',.22);color:'+pal.hex+';border-color:rgba('+pal.rgb+',.4)">'+escH(p.name.charAt(0).toUpperCase())+'</span>'+
      '<div style="min-width:0;flex:1"><span class="rh-name">'+escH(p.name)+'</span><span class="rh-card-pts">'+p.points+' pts now</span>'+(mp?'<div class="rh-must-note">⚠ must play — initial drop disabled</div>':'')+'</div>'+
      '<div class="rh-preview" data-rhprev>'+preview+'</div>'+
    '</div>'+
    '<div class="rh-card-grid">'+
      '<button class="rh-opt2'+(ch.type==='drop'?' on':'')+(mp?' disabled':'')+'" data-rhtype="drop" '+(mp?'':'onclick="rhPick(\''+escQ(p.name)+'\',\'drop\')"')+'><span class="rh-opt2-lbl">Drop</span><span class="rh-opt2-val">+20</span></button>'+
      '<button class="rh-opt2'+(ch.type==='mid'?' on':'')+'" data-rhtype="mid" onclick="rhPick(\''+escQ(p.name)+'\',\'mid\')"><span class="rh-opt2-lbl">Mid</span><span class="rh-opt2-val">+40</span></button>'+
      '<button class="rh-opt2'+(ch.type==='full'?' on':'')+'" data-rhtype="full" onclick="rhPick(\''+escQ(p.name)+'\',\'full\')"><span class="rh-opt2-lbl">Full</span><span class="rh-opt2-val">+80</span></button>'+
      '<div class="rh-opt2-custom'+(ch.type==='played'?' on':'')+'">'+
        '<input class="rh-custom2" type="number" inputmode="numeric" min="0" max="120" placeholder="Custom" value="'+(ch.type==='played'&&ch.custom!==''?ch.custom:'')+'" oninput="rhCustom(\''+escQ(p.name)+'\',this.value)"/>'+
      '</div>'+
    '</div>'+
  '</div>';
}
function rhSetWinner(name){
  Object.keys(rhChoices).forEach(function(n){rhChoices[n]={type:null,custom:''};});
  rhChoices[name]={type:'win',custom:''};
  haptic('light');
  renderRecordHandSheet();
}
function rhRefreshCard(name){
  var row=document.querySelector('[data-rh="'+cssEsc(name)+'"]');
  if(!row)return;
  var ch=rhChoices[name]||{type:null,custom:''};
  row.querySelectorAll('.rh-opt2[data-rhtype]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-rhtype')===ch.type);});
  var wrap=row.querySelector('.rh-opt2-custom');if(wrap)wrap.classList.toggle('on',ch.type==='played');
  var inp=row.querySelector('.rh-custom2');if(inp&&ch.type!=='played')inp.value='';
  var p=activePlayers().filter(function(x){return x.name===name;})[0];
  var prev=row.querySelector('[data-rhprev]');
  if(prev)prev.textContent=(ch.type&&p)?'→ '+(p.points+rhAddFor(ch))+' pts':'';
}
function rhRefreshSaveBtn(){
  var act=activePlayers();
  var winnerSet=act.some(function(p){return rhChoices[p.name]&&rhChoices[p.name].type==='win';});
  var allSet=winnerSet&&act.every(function(p){return rhChoices[p.name]&&rhChoices[p.name].type;});
  var btn=document.getElementById('rh-save-btn');
  if(btn)btn.disabled=!allSet;
}
function rhPick(name,type){
  rhChoices[name]={type:type,custom:''};
  haptic('light');
  rhRefreshCard(name);rhRefreshSaveBtn();
}
function rhCustom(name,val){
  var n=parseInt(val,10);
  if(val===''||isNaN(n))rhChoices[name]={type:null,custom:''};
  else rhChoices[name]={type:'played',custom:Math.max(0,Math.min(120,n))};
  rhRefreshCard(name);rhRefreshSaveBtn();
}
function cssEsc(s){return String(s).replace(/["\\]/g,'\\$&');}

/* ═══════════════ REPLAY ENGINE — timeline is the single source of truth ═══════════════
   Rebuilds players/points/streaks/eliminations/pot/round entirely from the ordered
   event log. This is what makes editing a past hand correct: change the event, replay,
   and everything downstream (including later eliminations and lateral-entry points) is
   recomputed exactly. */
function rebuildFromTimeline(){
  if(!game.timeline){game.timeline=[];}
  if(!game.starterNames){game.starterNames=game.players.map(function(p){return p.name;});}
  var byName={},order=[];
  game.starterNames.forEach(function(n){ byName[n]={name:n,points:0,streak:0,mustPlay:false,out:false,cashedOut:false,cashedOutCents:0,laterals:0}; order.push(n); });
  var pot=game.buyCents*game.starterNames.length, hands=[], round=0, lateralCount=0, cashouts=[];
  game.timeline.forEach(function(ev){
    if(ev.k==='lateral'){
      var actPts=order.map(function(n){return byName[n];}).filter(function(p){return !p.out&&!p.cashedOut;}).map(function(p){return p.points;});
      var lp=rLateralEntryPoints(actPts); if(lp===null)lp=ALIVE_MAX;
      if(byName[ev.name]){var p=byName[ev.name];p.out=false;p.cashedOut=false;p.cashedOutCents=0;p.points=lp;p.streak=0;p.laterals=(p.laterals||0)+1;}
      else{byName[ev.name]={name:ev.name,points:lp,streak:0,mustPlay:false,out:false,cashedOut:false,cashedOutCents:0,laterals:0};order.push(ev.name);}
      pot+=game.buyCents; lateralCount++;
    }else if(ev.k==='cashout'){
      // Cents are locked at the moment of cash-out — replay re-applies the stored
      // amount verbatim, it is never recomputed even if earlier hands are later edited.
      ev.entries.forEach(function(entry){
        var p=byName[entry.name];
        if(p){p.cashedOut=true;p.cashedOutCents=entry.cents;}
        pot-=entry.cents;
      });
      cashouts.push({round:round,entries:ev.entries});
    }else{ // hand
      round++;
      var rec={round:round,results:[]};
      ev.results.forEach(function(r){
        var p=byName[r.name];
        var add=(r.type==='drop')?DROP_UNIT:(r.type==='mid')?MID_DROP:(r.type==='full')?FULL_COUNT:(r.type==='win')?0:(+r.add||0);
        if(p&&!p.out&&!p.cashedOut){
          p.points+=add;
          if(r.type==='drop')p.streak++; else p.streak=0;
          if(rIsEliminated(p.points))p.out=true;
        }
        rec.results.push({name:r.name,type:r.type,add:add});
      });
      hands.push(rec);
    }
  });
  game.players=order.map(function(n){return byName[n];});
  game.potCents=pot; game.round=round; game.hands=hands; game.lateralCount=lateralCount; game.cashouts=cashouts;
  refreshMustPlay();
}

/* ═══════════════ EDIT / DELETE A RECORDED HAND ═══════════════ */
// Map a matrix hand number (1-based, hand events only) to its timeline index.
function _handEventIndex(handNo){
  var seen=0;
  for(var i=0;i<game.timeline.length;i++){ if(game.timeline[i].k==='hand'){ seen++; if(seen===handNo) return i; } }
  return -1;
}
var _editHandNo=null, _editChoices=null;
function openEditHand(handNo){
  if(game.ended){notify('This game is finished','info');return;}
  var idx=_handEventIndex(handNo); if(idx<0)return;
  var ev=game.timeline[idx];
  _editHandNo=handNo;
  _editChoices={};
  ev.results.forEach(function(r){ _editChoices[r.name]={type:r.type,custom:r.type==='played'?r.add:''}; });
  renderEditHandSheet();
}
function renderEditHandSheet(){
  var names=Object.keys(_editChoices);
  var winnerName=null;
  names.forEach(function(n){if(_editChoices[n].type==='win')winnerName=n;});
  var winnerRow='<div class="rh-winner-row">'+names.map(function(n){
    var pal=nameColor(n);var on=n===winnerName;
    return '<button class="rh-winner-btn'+(on?' on':'')+'" onclick="ehSetWinner(\''+escQ(n)+'\')">'+
      '<span class="rh-winner-av" style="background:'+(on?'rgba('+pal.rgb+',1)':'rgba('+pal.rgb+',.18)')+';color:'+(on?'#fff':pal.hex)+'">'+escH(n.charAt(0).toUpperCase())+'</span>'+
      '<span class="rh-winner-name">'+escH(n)+'</span>'+
    '</button>';
  }).join('')+'</div>';
  var others=names.filter(function(n){return n!==winnerName;});
  var body=winnerName
    ? '<div class="section-lbl" style="margin-top:16px">Everyone else</div>'+others.map(function(n){return ehCard(n);}).join('')
    : '<div class="pill-info" style="width:100%;justify-content:center;box-sizing:border-box;margin-top:6px">Pick the winner above first</div>';
  var allSet=!!winnerName&&others.every(function(n){return _editChoices[n]&&_editChoices[n].type;});
  openSheet(
    '<div class="sheet-title">Edit Hand '+_editHandNo+'</div>'+
    '<div class="sheet-sub">Fix a mis-entered result. Everything after this hand is recalculated automatically.</div>'+
    '<div class="section-lbl">Who won?</div>'+
    winnerRow+body+
    '<div style="display:flex;gap:8px;margin-top:18px">'+
      '<button class="btn btn-red" style="flex:1" onclick="deleteHand('+_editHandNo+')">Delete Hand</button>'+
      '<button class="btn btn-gold" id="eh-save-btn" style="flex:2" '+(allSet?'':'disabled')+' onclick="saveEditHand()">Save Changes</button>'+
    '</div>'+
    '<button class="btn btn-ghost mt" onclick="openRounds()">Cancel</button>'
  );
}
function ehCard(name){

  return '<div class="rh-card" data-eh="'+escH(name)+'">'+
    '<div class="rh-card-top">'+

      '<div style="min-width:0;flex:1"><span class="rh-name">'+escH(name)+'</span></div>'+
    '</div>'+
    '<div class="rh-card-grid">'+

      '<button class="rh-opt2'+(ch.type==='mid'?' on':'')+'" data-rhtype="mid" onclick="ehPick(\''+escQ(name)+'\',\'mid\')"><span class="rh-opt2-lbl">Mid</span><span class="rh-opt2-val">+40</span></button>'+
      '<button class="rh-opt2'+(ch.type==='full'?' on':'')+'" data-rhtype="full" onclick="ehPick(\''+escQ(name)+'\',\'full\')"><span class="rh-opt2-lbl">Full</span><span class="rh-opt2-val">+80</span></button>'+

        '<input class="rh-custom2" type="number" inputmode="numeric" min="0" max="120" placeholder="Custom" value="'+(ch.type==='played'&&ch.custom!==''?ch.custom:'')+'" oninput="ehCustom(\''+escQ(name)+'\',this.value)"/>'+
