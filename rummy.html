function ehSetWinner(name){
  Object.keys(_editChoices).forEach(function(n){_editChoices[n]={type:null,custom:''};});
  _editChoices[name]={type:'win',custom:''};
  haptic('light');
  renderEditHandSheet();
}
function ehRefreshCard(name){
  var row=document.querySelector('[data-eh="'+cssEsc(name)+'"]');
  if(!row)return;
  var ch=_editChoices[name]||{type:null,custom:''};
  row.querySelectorAll('.rh-opt2[data-rhtype]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-rhtype')===ch.type);});
  var wrap=row.querySelector('.rh-opt2-custom');if(wrap)wrap.classList.toggle('on',ch.type==='played');
  var inp=row.querySelector('.rh-custom2');if(inp&&ch.type!=='played')inp.value='';
}
function ehRefreshSaveBtn(){
  var names=Object.keys(_editChoices);
  var winnerSet=names.some(function(n){return _editChoices[n].type==='win';});
  var allSet=winnerSet&&names.every(function(n){return _editChoices[n]&&_editChoices[n].type;});
  var btn=document.getElementById('eh-save-btn');
  if(btn)btn.disabled=!allSet;
}
function ehPick(name,type){
  _editChoices[name]={type:type,custom:''};
  haptic('light');
  ehRefreshCard(name);ehRefreshSaveBtn();
}
function ehCustom(name,val){
  var n=parseInt(val,10);
  if(val===''||isNaN(n))_editChoices[name]={type:null,custom:''};
  else _editChoices[name]={type:'played',custom:Math.max(0,Math.min(120,n))};
  ehRefreshCard(name);ehRefreshSaveBtn();
}
function saveEditHand(){
  var names=Object.keys(_editChoices);
  var winners=names.filter(function(n){return _editChoices[n].type==='win';});
  if(winners.length!==1){notify('Pick exactly one winner','err');return;}
  var missing=names.filter(function(n){return !_editChoices[n].type;});
  if(missing.length){notify('Set a result for: '+missing.join(', '),'err');return;}
  var idx=_handEventIndex(_editHandNo); if(idx<0)return;
  game.timeline[idx].results=names.map(function(n){
    var ch=_editChoices[n];
    var add=(ch.type==='drop')?DROP_UNIT:(ch.type==='mid')?MID_DROP:(ch.type==='full')?FULL_COUNT:(ch.type==='win')?0:(+ch.custom||0);
    return {name:n,type:ch.type,add:add};
  });
  rebuildFromTimeline();saveGame();closeSheet();renderLive();
  haptic('success');notify('✅ Hand '+_editHandNo+' updated — scores recalculated','ok');
}
function deleteHand(handNo){
  if(!confirm('Delete Hand '+handNo+'? All later hands stay, and every score is recalculated.'))return;
  var idx=_handEventIndex(handNo); if(idx<0)return;
  game.timeline.splice(idx,1);
  rebuildFromTimeline();saveGame();closeSheet();renderLive();
  haptic('success');notify('🗑 Hand '+handNo+' deleted — scores recalculated','ok');
}

function commitHand(){
  var act=activePlayers();
  // validate: exactly one winner, everyone has a result
  var winners=act.filter(function(p){return rhChoices[p.name].type==='win';});
  if(winners.length!==1){notify('Pick exactly one winner','err');return;}
  var missing=act.filter(function(p){return !rhChoices[p.name].type;});
  if(missing.length){notify('Set a result for: '+missing.map(function(p){return p.name;}).join(', '),'err');return;}
  // validate played points
  for(var i=0;i<act.length;i++){var c=rhChoices[act[i].name];if(c.type==='played'&&(isNaN(c.custom)||c.custom<0||c.custom>120)){notify('Played points must be 0–120','err');return;}}

  var results=act.map(function(p){
    var ch=rhChoices[p.name];
    var add=(ch.type==='drop')?DROP_UNIT:(ch.type==='mid')?MID_DROP:(ch.type==='full')?FULL_COUNT:(ch.type==='win')?0:ch.custom;
    return {name:p.name,type:ch.type,add:add};
  });
  var outBefore=game.players.filter(function(p){return p.out;}).map(function(p){return p.name;});
  game.timeline.push({k:'hand',results:results});
  rebuildFromTimeline();                 // single source of truth: recompute all state
  var newlyOut=game.players.filter(function(p){return p.out&&outBefore.indexOf(p.name)<0;}).map(function(p){return p.name;});

  saveGame();closeSheet();
  // number pop on changed points
  renderLive();
  act.forEach(function(p){var el=document.querySelector('[data-pts="'+cssEsc(p.name)+'"]');if(el){el.classList.remove('num-pop');void el.offsetWidth;el.classList.add('num-pop');}});

  // immediate warnings
  if(newlyOut.length){haptic('heavy');notify('❌ '+newlyOut.join(', ')+' hit 201 — eliminated','err');}
  var a2=activePlayers();
  // Only warn about must-play if there IS a next hand — skip it when this result just
  // ended the game (a winner is about to be declared), so "MUST PLAY" never flashes
  // over the win/results transition.
  if(a2.length>1){
    var mpMsgs=[];
    a2.forEach(function(p){
      if(p.streak>=3)mpMsgs.push(p.name+' (3 drops)');
      else if(p.points>MUST_PLAY_OVER)mpMsgs.push(p.name+' (>180)');
    });
    if(mpMsgs.length){setTimeout(function(){notify('⚠ MUST PLAY next hand: '+mpMsgs.join(', '),'warn');},newlyOut.length?900:0);}
  }

  // auto-end check
  if(a2.length===1){setTimeout(function(){finishWinner();},600);}
}

/* ═══════════════ LATERAL ENTRY ═══════════════ */
function openLateral(){
  if(game.ended)return;
  var act=activePlayers();
  if(act.length>=MAX_PLAYERS){notify('Table full ('+MAX_PLAYERS+')','warn');return;}
  var actPts=act.map(function(p){return p.points;});
  var lp=rLateralEntryPoints(actPts);
  if(lp===null){notify('No room — leader is already at '+Math.max.apply(null,actPts)+' (entry would bust)','warn');return;}
  // candidates: eliminated players (re-entry) + roster/guests not currently in game
  var inGame={};game.players.forEach(function(p){if(!p.out)inGame[p.name]=1;});
  var outNames=game.players.filter(function(p){return p.out;}).map(function(p){return p.name;});
  var newNames=roster.concat(guests).filter(function(n){return !inGame[n]&&outNames.indexOf(n)<0;});
  var opt=function(name,tag){var pal=nameColor(name);return '<button class="split-row" style="width:100%;border:1px solid var(--c-bdr);cursor:pointer;text-align:left" onclick="doLateral(\''+escQ(name)+'\')">'+
    '<span style="display:flex;align-items:center;gap:10px"><span class="rh-av" style="background:rgba('+pal.rgb+',.22);color:'+pal.hex+';border-color:rgba('+pal.rgb+',.4)">'+escH(name.charAt(0).toUpperCase())+'</span><span style="font-weight:700;color:var(--c-txt)">'+escH(name)+'</span></span>'+
    '<span style="font-family:var(--font-mono);font-size:11px;color:var(--c-txt2)">'+tag+'</span></button>';};
  var html='<div class="sheet-title">Lateral Entry</div>'+
    '<div class="sheet-sub">Joins at <b style="color:var(--c-gold)">'+lp+' pts</b> (leader +1) and adds '+fmt(stake)+' to the pot.</div>'+
    '<div class="section-lbl">Add a new player</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:16px">'+
      '<input class="guest-inp" id="lat-guest-inp" type="text" placeholder="Type a name…" autocomplete="off" onkeydown="if(event.key===\'Enter\')addGuestLateral()"/>'+
      '<button class="btn btn-gold btn-sm" style="flex-shrink:0" onclick="addGuestLateral()">Add</button>'+
    '</div>';
  if(outNames.length){html+='<div class="section-lbl">Re-enter</div>'+outNames.map(function(n){return opt(n,'re-buy');}).join('');}
  if(newNames.length){html+='<div class="section-lbl" style="margin-top:10px">Or pick someone</div>'+newNames.slice(0,40).map(function(n){return opt(n,'join');}).join('');}
  html+='<button class="btn btn-ghost mt" onclick="closeSheet()">Cancel</button>';
  openSheet(html);
}
function addGuestLateral(){
  var inp=document.getElementById('lat-guest-inp');
  if(!inp)return;
  var name=inp.value.trim();
  if(!name)return;
  if(roster.concat(guests).some(function(n){return n.toLowerCase()===name.toLowerCase();})){notify('Name already exists — pick them from the list below','warn');return;}
  guests.push(name);
  inp.value='';
  doLateral(name);
}
function doLateral(name){
  var actPts=activePlayers().map(function(p){return p.points;});
  var lp=rLateralEntryPoints(actPts);
  if(lp===null){notify('No room for entry','warn');closeSheet();return;}
  game.timeline.push({k:'lateral',name:name});
  rebuildFromTimeline();
  saveGame();closeSheet();renderLive();
  haptic('success');notify('➕ '+name+' entered at '+lp+' pts · pot '+fmt(fromCents(game.potCents)),'ok');
}

/* ═══════════════ SMART SPLIT / PARTIAL CASH-OUT ═══════════════
   Every share is rounded to the nearest $5 (rSplitPayoutCents5), weighted by drop
   choices. Each player can individually choose to lock in their share now ("cash
   out") and leave, while anyone left unchecked keeps playing for what remains. */
var _splitSel={};
function openSplit(){
  var act=activePlayers().slice().sort(function(a,b){return a.points-b.points;});
  var pts=act.map(function(p){return p.points;});
  var pay=rSplitPayoutCents5(game.potCents,pts);
  var weights=rSplitWeights(pts);var wsum=weights.reduce(function(a,b){return a+b;},0);
  _splitSel={}; act.forEach(function(p){_splitSel[p.name]=true;}); // default: everyone cashes out (= full split)
  var rows=act.map(function(p,i){
    var pal=nameColor(p.name);
    return '<label class="cashout-row on">'+
      '<input type="checkbox" class="cashout-native" checked onchange="splitToggle(\''+escQ(p.name)+'\',this)"/>'+
      '<span class="cashout-check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>'+
      '<span class="rh-av" style="background:rgba('+pal.rgb+',.22);color:'+pal.hex+';border-color:rgba('+pal.rgb+',.4)">'+escH(p.name.charAt(0).toUpperCase())+'</span>'+
      '<span class="cashout-info"><span class="cashout-name">'+escH(p.name)+'</span>'+
        '<span class="cashout-meta">'+p.points+' pts · '+rDropChoices(p.points)+' drops · weight '+weights[i]+'/'+wsum+'</span></span>'+
      '<span class="cashout-right"><span class="cashout-amt">'+fmt(fromCents(pay[i]))+'</span><span class="cashout-tag">Cash out</span></span>'+
    '</label>';
  }).join('');
  var isThree=act.length===3;
  var html='<div class="sheet-title">'+(isThree?'Smart Split':'End Game — Split')+'</div>'+
    '<div class="sheet-sub">Shares are rounded to the nearest $5, weighted by drop choices (fewer points → bigger share). Uncheck anyone who wants to keep playing for the rest of the pot — only checked players cash out now.</div>'+
    rows+
    '<div style="display:flex;gap:8px;margin-top:18px">'+
      '<button class="btn btn-ghost" style="flex:1" onclick="closeSheet()">'+(isThree?'Keep Playing':'Play On')+'</button>'+
      '<button class="btn btn-green" style="flex:2" onclick="commitSplitSelection()">Cash Out Checked</button>'+
    '</div>';
  openSheet(html);
}
function splitToggle(name,inp){
  var checked=inp.checked;
  _splitSel[name]=checked;
  var row=inp.closest('.cashout-row');
  if(row){
    row.classList.toggle('on',checked);
    var tag=row.querySelector('.cashout-tag');if(tag)tag.textContent=checked?'Cash out':'Playing on';
  }
}
function commitSplitSelection(){
  var act=activePlayers().slice().sort(function(a,b){return a.points-b.points;});
  var pts=act.map(function(p){return p.points;});
  var pay=rSplitPayoutCents5(game.potCents,pts);
  var payouts=act.map(function(p,i){return {name:p.name,cents:pay[i],points:p.points,drops:rDropChoices(p.points)};});
  var selectedNames=act.filter(function(p){return _splitSel[p.name];}).map(function(p){return p.name;});
  if(!selectedNames.length){notify('Check at least one player to cash out','warn');return;}
  if(selectedNames.length===act.length){ endGame(payouts,'split'); return; }
  var entries=payouts.filter(function(p){return selectedNames.indexOf(p.name)>=0;});
  game.timeline.push({k:'cashout',entries:entries});
  rebuildFromTimeline();saveGame();closeSheet();renderLive();
  haptic('success');
  notify('💰 '+entries.map(function(e){return e.name+' '+fmt(fromCents(e.cents));}).join(', ')+' cashed out — game continues','ok');
}
function finishWinner(){
  var act=activePlayers();
  if(act.length!==1)return;
  endGame([{name:act[0].name,cents:game.potCents,points:act[0].points,drops:rDropChoices(act[0].points)}],'winner');
}
function goSetupConfirm(){
  if(confirm('Exit this game? Progress is saved and you can resume.')){stopTimer();show('setup');}
}

/* ═══════════════ END / RESULTS ═══════════════ */
// Every payout ever made this game: early cash-outs (locked, from game.cashouts)
// plus the final split/winner payout — together these always sum to the full
// starting pot (buy-ins + laterals), since cashouts are deducted from potCents
// as they happen and the final payout settles whatever's left.
function allPayouts(g){
  var early=[];
  (g.cashouts||[]).forEach(function(c){c.entries.forEach(function(e){early.push({name:e.name,cents:e.cents,points:e.points,drops:e.drops,early:true});});});
  var finalp=(g.result?g.result.payouts:[]).map(function(e){return {name:e.name,cents:e.cents,points:e.points,drops:e.drops,early:false};});
  return early.concat(finalp);
}
function endGame(payouts,mode){
  game.ended=true;game.endedAt=Date.now();game.result={payouts:payouts,mode:mode};
  stopTimer();closeSheet();saveGame();
  // verify sum == remaining pot (defensive) — cashouts already came out of potCents
  var sum=payouts.reduce(function(a,p){return a+p.cents;},0);
  if(sum!==game.potCents){console.error('[rummy] payout mismatch',sum,game.potCents);}
  var rec=saveToHistory(game);
  dbDeleteRummyLiveSession(String(game.startedAt)).catch(function(){});
  dbInsertRummySession(rec).catch(function(e){console.warn('[rummy-cloud] history push failed:',e.message);});
  renderResults();show('results');haptic('success');launchConfetti();
}
function renderResults(){
  var r=game.result;
  var dur=Math.floor((game.endedAt-game.startedAt)/1000);
  var durStr=(Math.floor(dur/3600)>0?Math.floor(dur/3600)+'h ':'')+Math.floor((dur%3600)/60)+'m';
  var all=allPayouts(game);
  var totalPotCents=game.potCents+(game.cashouts||[]).reduce(function(a,c){return a+c.entries.reduce(function(s,e){return s+e.cents;},0);},0);
  var sorted=all.slice().sort(function(a,b){return b.cents-a.cents;});
  var winner=r.mode==='winner'?r.payouts[0]:null;
  var podium=r.mode==='winner'
    ? '<div style="text-align:center;padding:10px 0 20px"><div style="font-size:52px;margin-bottom:6px" class="pod-medal">🏆</div>'+
        '<div style="font-family:var(--font-heading);font-size:26px;font-weight:700;color:var(--c-gold)">'+escH(winner.name)+'</div>'+
        '<div style="font-family:var(--font-mono);font-size:13px;color:var(--c-green);margin-top:4px">wins '+fmt(fromCents(winner.cents))+' · '+winner.points+' pts</div></div>'

function _roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function _buildRummyCanvas(g){
  var SC=2, W=390*SC, px=function(n){return Math.round(n*SC);};
  var PAD=px(22), FONT='Inter,system-ui,sans-serif', MONO='JetBrains Mono,monospace';
  var aRgb=currentTheme?currentTheme.accentRgb:'168,85,247', aHex=currentTheme?currentTheme.accent:'#A855F7';
  var cRgb=currentTheme?currentTheme.compRgb:'34,211,238', bg=currentTheme?currentTheme.bg:'#0E0620';
  var r=g.result, all=allPayouts(g), sorted=all.slice().sort(function(a,b){return b.cents-a.cents;});
  var cashed={}; all.forEach(function(p){cashed[p.name]=1;});
  var elim=g.players.filter(function(p){return !cashed[p.name];}).sort(function(a,b){return a.points-b.points;});
  var HDR=px(78), ROW=px(40), ELIMROW=px(32);
  var buyDate=new Date(g.startedAt||Date.now()).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  var mctx=document.createElement('canvas').getContext('2d');
  // measure column right edges
  var netR=W-PAD, ptsR=netR-px(78);
  var nameL=PAD+px(30);

  function draw(ctx){
    // bg + glow
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,ctx.canvas.height);
    var gl=ctx.createRadialGradient(0,0,0,0,0,W*0.7); gl.addColorStop(0,'rgba('+aRgb+',.16)'); gl.addColorStop(1,'rgba('+aRgb+',0)');
    ctx.fillStyle=gl; ctx.fillRect(0,0,W,HDR+px(20));
    ctx.fillStyle=aHex; ctx.fillRect(0,0,W,px(3));
    // logo badge
    var bs=px(38), bx=PAD, by=px(16);
    var lg=ctx.createLinearGradient(bx,by,bx+bs,by+bs); lg.addColorStop(0,'rgba('+aRgb+',1)'); lg.addColorStop(1,'rgba('+cRgb+',1)');
    ctx.fillStyle=lg; _roundRect(ctx,bx,by,bs,bs,px(11)); ctx.fill();
    ctx.save(); ctx.translate(bx+bs/2,by+bs/2); ctx.scale(bs/34,bs/34); ctx.fillStyle='#fff';
    ctx.fill(new Path2D('M0 -13c-2 4-5.3 6-9.3 6.7 4 .7 7.3 2.7 9.3 6.7 2-4 5.3-6 9.3-6.7-4-.7-7.3-2.7-9.3-6.7z'));
    ctx.beginPath(); ctx.arc(-8,7,3.2,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(8,7,3.2,0,7); ctx.fill(); ctx.restore();
    ctx.fillStyle='#fff'; ctx.font='800 '+px(22)+'px '+FONT; ctx.textAlign='left'; ctx.fillText('Hutto Rummy',bx+bs+px(10),by+px(25));
    var mode=(r.mode==='winner'?'Winner takes all':(all.length+'-way smart split'));
    var totalPotCents=g.potCents+(g.cashouts||[]).reduce(function(a,c){return a+c.entries.reduce(function(s,e){return s+e.cents;},0);},0);
    var meta=buyDate+' · '+g.players.length+' players · '+fmt(totalPotCents/100)+' pot · '+mode;
    ctx.fillStyle='rgba(255,255,255,.5)'; var ms=px(11.5); ctx.font='500 '+ms+'px '+MONO;
    while(ctx.measureText(meta).width>W-PAD*2&&ms>px(9)){ms-=1;ctx.font='500 '+ms+'px '+MONO;}
    ctx.fillText(meta,PAD,by+bs+px(16));

    var y=HDR+px(14);
    ctx.fillStyle='rgba('+aRgb+',.85)'; ctx.font='800 '+px(11)+'px '+MONO; ctx.textAlign='left'; ctx.fillText('FINAL STANDINGS',PAD,y+px(9));
    ctx.textAlign='right'; ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='700 '+px(10)+'px '+MONO;
    ctx.fillText('PTS',ptsR,y+px(9)); ctx.fillText('WON',netR,y+px(9));
    y+=px(20); ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(PAD,y,W-PAD*2,px(1)); y+=px(8);

    var medals=['🥇','🥈','🥉'];
    sorted.forEach(function(p,i){
      if(i%2===1){ctx.fillStyle='rgba(255,255,255,.03)'; ctx.fillRect(PAD-px(4),y,W-PAD*2+px(8),ROW);}
      var mid=y+ROW*0.5;
      ctx.textAlign='left'; ctx.font=px(16)+'px '+FONT; ctx.fillStyle='#fff';
      if(i<3)ctx.fillText(medals[i],PAD-px(2),mid+px(6)); else {ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='700 '+px(13)+'px '+MONO;ctx.fillText(String(i+1),PAD+px(2),mid+px(5));}
      ctx.fillStyle=i===0?'#fff':'rgba(255,255,255,.9)'; ctx.font=(i===0?'800':'700')+' '+px(16)+'px '+FONT;
      ctx.fillText(p.name,nameL,mid+px(6));
      ctx.textAlign='right'; ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='500 '+px(14)+'px '+MONO; ctx.fillText(String(p.points),ptsR,mid+px(5));
      ctx.fillStyle='#22C55E'; ctx.font='800 '+px(16)+'px '+MONO; ctx.fillText(fmt(p.cents/100),netR,mid+px(6));
      ctx.textAlign='left'; y+=ROW;
    });
    if(elim.length){
      y+=px(10); ctx.fillStyle='rgba(239,68,68,.7)'; ctx.font='800 '+px(11)+'px '+MONO; ctx.textAlign='left'; ctx.fillText('ELIMINATED',PAD,y+px(9)); y+=px(18);
      elim.forEach(function(p){
        var mid=y+ELIMROW*0.5;
        ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='600 '+px(14)+'px '+FONT; ctx.textAlign='left'; ctx.fillText(p.name,PAD,mid+px(5));
        ctx.fillStyle='#F87171'; ctx.font='700 '+px(14)+'px '+MONO; ctx.textAlign='right'; ctx.fillText(p.points+' pts',netR,mid+px(5)); ctx.textAlign='left';
        y+=ELIMROW;
      });
    }
    y+=px(20); ctx.fillStyle='rgba(255,255,255,.15)'; ctx.fillRect(PAD,y,W-PAD*2,px(1)); y+=px(20);
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.font='400 '+px(11)+'px '+MONO; ctx.textAlign='center';
    ctx.fillText('Hutto Rummy 201  ·  huttopoker.github.io',W/2,y); ctx.textAlign='left';
    return y+px(16);
  }
  var H=draw(mctx);
  var canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H;
  draw(canvas.getContext('2d'));
  return canvas;
}

async function _shareImg(dataUrl,fname){
  try{
    var blob=await(await fetch(dataUrl)).blob();
    var file=new File([blob],fname,{type:'image/png'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({title:'Hutto Rummy — Results',files:[file]}); return; }
  }catch(e){ if(e.name==='AbortError')return; }
  // desktop fallback: download + open WhatsApp web
  var a=document.createElement('a');a.href=dataUrl;a.download=fname;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){window.open('https://web.whatsapp.com/','_blank');},500);
}

}

function shortName(n){var t=String(n).split(' ')[0];return t.length>7?t.slice(0,6)+'…':t;}
function renderRoundMatrix(g,editable){
  if(!g.hands||!g.hands.length)return '<div class="pill-info" style="width:100%;justify-content:center;box-sizing:border-box">No hands recorded yet</div>';
  var players=g.players.map(function(p){return p.name;});
  var head='<th class="rmx-h">Hand</th>'+players.map(function(n){return '<th title="'+escH(n)+'">'+escH(shortName(n))+'</th>';}).join('');
  var body=g.hands.map(function(h){
    var by={};h.results.forEach(function(r){by[r.name]=r;});
    var cells=players.map(function(n){
      var r=by[n];
      if(!r)return '<td class="rmx-zero">·</td>';
      if(r.type==='win')return '<td class="rmx-win">W</td>';
      if(r.type==='drop')return '<td class="rmx-drop">20↓</td>';
      if(r.add===0)return '<td class="rmx-zero">0</td>';
      return '<td>+'+r.add+'</td>';
    }).join('');
    var handCell=editable
      ? '<td class="rmx-h"><button class="rmx-edit" onclick="openEditHand('+h.round+')">'+h.round+' <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></td>'
      : '<td class="rmx-h">'+h.round+'</td>';
    return '<tr>'+handCell+cells+'</tr>';
  }).join('');
  var foot='<td class="rmx-h">Total</td>'+g.players.map(function(p){return '<td class="'+(p.out?'out':'')+'">'+p.points+(p.out?' ✕':'')+'</td>';}).join('');
  return '<div class="rmx-scroll"><table class="rmx"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody>'+
    '<tfoot><tr>'+foot+'</tr></tfoot></table></div>'+
    '<div class="rmx-legend"><span style="color:var(--c-green)">W = won hand</span><span style="color:var(--c-orange)">20↓ = initial drop</span><span>+N = points that hand</span><span style="color:var(--c-red)">✕ = out</span></div>';
}

/* ═══════════════ HISTORY (rummy-only, separate from poker) ═══════════════ */
var RUMMY_HIST_KEY='rummy-hist-v1';
function loadHistory(){try{var a=JSON.parse(localStorage.getItem(RUMMY_HIST_KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
function saveHistoryArr(a){try{localStorage.setItem(RUMMY_HIST_KEY,JSON.stringify(a));}catch(e){}}
function saveToHistory(g){
  var all=allPayouts(g);
  var cashed={};all.forEach(function(p){cashed[p.name]=p.cents;});
  var totalPotCents=g.potCents+(g.cashouts||[]).reduce(function(a,c){return a+c.entries.reduce(function(s,e){return s+e.cents;},0);},0);
  var rec={
    id:g.startedAt,
    dateLabel:new Date(g.startedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
    potCents:totalPotCents,buyCents:g.buyCents,mode:g.result.mode,
    durationSecs:Math.floor((g.endedAt-g.startedAt)/1000),
    players:g.players.map(function(p){return {name:p.name,points:p.points,out:p.out,cashedOut:!!p.cashedOut,payoutCents:cashed[p.name]||0,laterals:p.laterals||0};}),
    hands:g.hands
  };
  var hist=loadHistory();hist.unshift(rec);if(hist.length>200)hist=hist.slice(0,200);saveHistoryArr(hist);
  return rec;
}
// Aggregate per-player stats across all finished games.
function computeRummyStats(){
  var hist=loadHistory();var byP={};
  hist.forEach(function(g){
    // find top payout that game (for "win" credit)
    var top=0;g.players.forEach(function(p){if(p.payoutCents>top)top=p.payoutCents;});
    g.players.forEach(function(p){
      var s=byP[p.name]||(byP[p.name]={name:p.name,games:0,wins:0,cashed:0,elims:0,wonCents:0,stakedCents:0,pts:0});
      s.games++;
      s.stakedCents+=g.buyCents*(1+(p.laterals||0));
      s.wonCents+=p.payoutCents;
      s.pts+=p.points;
      if(p.payoutCents>0)s.cashed++;
      if(p.payoutCents===top&&top>0)s.wins++;
      if(p.out)s.elims++;
    });
  });
  var arr=Object.keys(byP).map(function(k){var s=byP[k];s.netCents=s.wonCents-s.stakedCents;s.avgPts=s.games?Math.round(s.pts/s.games):0;return s;});
  arr.sort(function(a,b){return b.netCents-a.netCents;});
  return {games:hist.length,history:hist,players:arr};
}

  if(!st.games){
    el.innerHTML='<button class="back-btn" onclick="statsBack()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Back</button>'+
      '<div class="page-title">Stats</div><div class="page-sub">Rummy analytics — kept separate from poker</div>'+
      '<div class="empty-wrap"><div class="empty-emoji">📊</div><div style="font-weight:800;font-size:18px;color:var(--c-txt);margin-bottom:6px">No games yet</div>'+
      '<div style="font-family:var(--font-mono);font-size:12px;color:var(--c-muted)">Finish a game to build your history &amp; leaderboard.</div></div>';
    return;
  }
  var totalPot=st.history.reduce(function(a,g){return a+g.potCents;},0);
  var topWin=st.players.slice().sort(function(a,b){return b.wins-a.wins;})[0];
  var maxAbs=Math.max.apply(null,st.players.map(function(p){return Math.abs(p.netCents);}))||1;
  var medals=['🥇','🥈','🥉'];
  var lb=st.players.map(function(p,i){
    var pos=p.netCents>=0;
    var pct=Math.round(Math.abs(p.netCents)/maxAbs*100);
    var pal=nameColor(p.name);
    var rank=i<3?'<span style="font-size:15px">'+medals[i]+'</span>':(i+1);
    return '<div class="lb-row"><div class="lb-rank">'+rank+'</div>'+
      '<div class="lb-av" style="background:rgba('+pal.rgb+',.22);color:'+pal.hex+';border-color:rgba('+pal.rgb+',.4)">'+escH(p.name.charAt(0).toUpperCase())+'</div>'+
      '<div style="min-width:0"><div style="font-weight:700;color:var(--c-txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escH(p.name)+'</div>'+
      '<div style="font-family:var(--font-mono);font-size:11px;color:var(--c-txt2);margin-top:2px">'+p.games+'g · '+p.wins+'W · '+p.elims+' out · avg '+p.avgPts+' pts</div>'+
      '<div class="lb-bar-track"><div class="lb-bar-fill" style="width:'+pct+'%;background:'+(pos?'var(--c-green)':'var(--c-red)')+'"></div></div></div>'+
      '<div class="lb-net" style="color:'+(pos?'var(--c-green)':'var(--c-red)')+'">'+(pos?'+':'−')+fmt(Math.abs(p.netCents)/100)+'</div></div>';
  }).join('');
  var games=st.history.map(function(g,i){
    var winner=g.players.slice().sort(function(a,b){return b.payoutCents-a.payoutCents;})[0];
    return '<div class="hist-card" onclick="openGameDetail('+i+')">'+
      '<div style="min-width:0"><div class="hist-win">'+(g.mode==='winner'?'🏆 ':'🤝 ')+escH(winner?winner.name:'—')+'</div>'+
      '<div class="hist-date">'+escH(g.dateLabel)+' · '+g.players.length+'p · '+(g.mode==='winner'?'winner':g.result?'':'split')+'</div></div>'+
      '<div style="text-align:right"><div style="font-family:var(--font-mono);font-size:14px;font-weight:800;color:var(--c-gold)">'+fmt(g.potCents/100)+'</div>'+
      '<div class="hist-date">pot</div></div></div>';
  }).join('');
  el.innerHTML=
    '<button class="back-btn" onclick="statsBack()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Back</button>'+
    '<div class="page-title">Stats</div><div class="page-sub">Rummy analytics — separate from poker</div>'+
    '<div class="stat-kpi-grid">'+
      '<div class="stat-kpi"><div class="stat-kpi-val" style="color:var(--c-gold)">'+st.games+'</div><div class="stat-kpi-lbl">Games</div></div>'+
      '<div class="stat-kpi"><div class="stat-kpi-val">'+fmt(totalPot/100)+'</div><div class="stat-kpi-lbl">Total Pot</div></div>'+
      '<div class="stat-kpi"><div class="stat-kpi-val" style="font-size:15px">'+escH(topWin&&topWin.wins?shortName(topWin.name):'—')+'</div><div class="stat-kpi-lbl">Most Wins</div></div>'+
    '</div>'+
    '<div class="section-lbl">Leaderboard — net winnings</div>'+lb+
    '<div class="section-lbl" style="margin-top:18px">Game history</div>'+games;
}
function openGameDetail(i){
  var st=computeRummyStats();var g=st.history[i];if(!g)return;
  var sorted=g.players.slice().sort(function(a,b){return b.payoutCents-a.payoutCents;});
  var rows=sorted.map(function(p){
    return '<div class="split-row"><span style="font-weight:700;color:'+(p.out?'var(--c-txt2)':'var(--c-txt)')+'">'+escH(p.name)+' <span style="font-family:var(--font-mono);font-size:11px;color:var(--c-txt2)">'+p.points+' pts'+(p.cashedOut?' · cashed out early':'')+'</span></span>'+
      '<span class="split-payout" style="color:'+(p.payoutCents>0?'var(--c-green)':'var(--c-muted2)')+'">'+(p.payoutCents>0?fmt(p.payoutCents/100):'—')+'</span></div>';
  }).join('');
  openSheet('<div class="sheet-title">'+escH(g.dateLabel)+'</div><div class="sheet-sub">'+(g.mode==='winner'?'Winner takes all':'Smart split')+' · '+g.players.length+' players · pot '+fmt(g.potCents/100)+'</div>'+
    rows+
    '<div class="section-lbl" style="margin-top:16px">Round-by-round</div>'+renderRoundMatrix(g)+
    '<button class="btn btn-ghost mt" onclick="closeSheet()">Close</button>');
}

/* ═══════════════ RESUME PROMPT ═══════════════ */
function offerResume(g){
  var act=g.players.filter(function(p){return !p.out;}).length;
  openSheet(
    '<div class="sheet-title">Resume game?</div>'+
    '<div class="sheet-sub">'+g.players.length+' players · hand '+g.round+' · '+act+' still in · pot '+fmt(fromCents(g.potCents))+'</div>'+
    '<button class="btn btn-gold" onclick="resumeGame()">Resume</button>'+
    '<button class="btn btn-ghost mt" onclick="discardResume()">Start fresh</button>'
  );
}
function resumeGame(){
  game=loadGame();closeSheet();stake=fromCents(game.buyCents);_lastPot=null;
  // Migrate older saves that predate the editable timeline so edits still work.
  if(!game.timeline){
    game.starterNames=game.starterNames||game.players.filter(function(p){return !p.laterals;}).map(function(p){return p.name;});
    if(!game.starterNames.length)game.starterNames=game.players.map(function(p){return p.name;});
    game.timeline=(game.hands||[]).map(function(h){return {k:'hand',results:h.results};});
    saveGame();
  }
  renderLive();show('live');startTimer();
}
function discardResume(){clearGame();closeSheet();}

/* ═══════════════ RESUME A LIVE GAME FROM ANOTHER DEVICE ═══════════════ */
var _pendingCloudGame=null;
function offerResumeCloud(row){
  var g=row.game_state;
  var act=g.players.filter(function(p){return !p.out&&!p.cashedOut;}).length;
  _pendingCloudGame=g;
  openSheet(
    '<div class="sheet-title">Live game on another device</div>'+
    '<div class="sheet-sub">'+g.players.length+' players · hand '+g.round+' · '+act+' still in · pot '+fmt(fromCents(g.potCents))+'</div>'+
    '<button class="btn btn-gold" onclick="resumeCloudGame()">Join / Resume Here</button>'+
    '<button class="btn btn-ghost mt" onclick="_pendingCloudGame=null;closeSheet()">Not now</button>'
  );
}
function resumeCloudGame(){
  if(!_pendingCloudGame)return;
  game=_pendingCloudGame;_pendingCloudGame=null;
  closeSheet();stake=fromCents(game.buyCents);_lastPot=null;
  if(!game.timeline){
    game.starterNames=game.starterNames||game.players.map(function(p){return p.name;});
    game.timeline=(game.hands||[]).map(function(h){return {k:'hand',results:h.results};});
  }
  saveGame();
  renderLive();show('live');startTimer();
}

/* ═══════════════ TAP RIPPLE ═══════════════ */
document.addEventListener('pointerdown',function(e){
  var btn=e.target.closest('.btn');
  if(!btn||btn.disabled)return;
  var rect=btn.getBoundingClientRect(),size=Math.max(rect.width,rect.height)*2.2;
  var r=document.createElement('span');r.className='tap-ripple';
  r.style.width=r.style.height=size+'px';r.style.left=(e.clientX-rect.left)+'px';r.style.top=(e.clientY-rect.top)+'px';
  btn.appendChild(r);setTimeout(function(){r.remove();},600);
},{passive:true});

/* ═══════════════ BOOT ═══════════════ */
(function boot(){
  try{var t=localStorage.getItem('rummy-theme');applyTheme(THEMES[t!==null?(parseInt(t,10)%THEMES.length):0]);}catch(e){applyTheme(THEMES[0]);}
  loadRoster();
  buildStakeRow();buildPGrid();
  var g=loadGame();
  if(g){
    offerResume(g);
  }else{
    // No local in-progress game — check the cloud for a live game started on another device.
    dbLoadLatestRummyLiveSession().then(function(row){
      if(!row||!row.game_state||row.game_state.ended||game)return;
      offerResumeCloud(row);
    }).catch(function(){});
  }
  syncRummyHistory().catch(function(){});
})();
window.addEventListener('error',function(e){console.error('[rummy]',e.message);});
</script>
